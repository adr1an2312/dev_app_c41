<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Ablaufplan für C-41 bei 30 °C mit Adox C-TEC 41: Übersicht, Packliste und Arbeitsweg mit Timer und Rotationssignalen.">
<meta name="theme-color" media="(prefers-color-scheme: light)" content="#E8ECEA">
<meta name="theme-color" media="(prefers-color-scheme: dark)" content="#101518">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='34' r='24' fill='%231F6C9E'/%3E%3Crect x='26' y='2' width='12' height='8' rx='2' fill='%231F6C9E'/%3E%3Cpath d='M32 34V18' stroke='white' stroke-width='5' stroke-linecap='round'/%3E%3C/svg%3E">
<style>
:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0}
[hidden]{display:none!important}
img{max-width:100%}
</style>
<title>C-41 Ablaufplan 30 °C</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;700&display=swap">
<style>
:root{
  /* Stil: achromatic ledger (taste-skill). Farbloses Chrom auf einem kühlen Laborgrau, fast schwarzer Hauptknopf.
     Farbe nur als Daten: das aktuelle Bad und sein Signal. Layout: Fahrplan links, aktueller Schritt groß, nächster Schritt rechts. */
  --bg:#f2f4f7; --panel:#ffffff; --raised:#ffffff; --ink:#0a0a0a; --muted:#5f6368; --line:#e6e6e6;
  --accent:#141414; --on-accent:#ffffff; --pill:#e5e5e5;
  --dev:#985A0B; --blix:#9E3350; --water:#1d5fbf; --stab:#2F7748; --prep:#5f6368; --on-bath:#ffffff;
  --warn:#c4242a; --on-warn:#ffffff; --ok:#2e7d32;
  --track:#eceef1; --shade:#e6e6e6;
  --f-display:"Geist",Inter,system-ui,sans-serif;
  --f-body:"Geist",Inter,system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#000000; --panel:#111111; --raised:#1a1a1a; --ink:#ffffff; --muted:#b4b4b4; --line:#2e2e2e;
    --accent:#ffffff; --on-accent:#000000; --pill:#222222;
    --dev:#E2A24E; --blix:#E57E97; --water:#6ea8f5; --stab:#7FCB98; --prep:#949494; --on-bath:#0a0a0a;
    --warn:#e5566f; --on-warn:#0a0a0a; --ok:#3fc07a;
    --track:#222222; --shade:#2e2e2e;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#000000; --panel:#111111; --raised:#1a1a1a; --ink:#ffffff; --muted:#b4b4b4; --line:#2e2e2e;
  --accent:#ffffff; --on-accent:#000000; --pill:#222222;
  --dev:#E2A24E; --blix:#E57E97; --water:#6ea8f5; --stab:#7FCB98; --prep:#949494; --on-bath:#0a0a0a;
  --warn:#e5566f; --on-warn:#0a0a0a; --ok:#3fc07a;
  --track:#222222; --shade:#2e2e2e;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:14px;line-height:1.45;font-variant-numeric:tabular-nums}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}

.b-dev{--bc:var(--dev)} .b-blix{--bc:var(--blix)} .b-water{--bc:var(--water)} .b-stab{--bc:var(--stab)} .b-prep{--bc:var(--prep)}

.shell{height:100%;display:flex;flex-direction:column;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.top{display:flex;align-items:center;gap:12px 18px;padding-block:10px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.brand{display:flex;align-items:baseline;gap:10px;min-width:0}
.mark{font-family:var(--f-display);font-weight:700;font-size:20px;letter-spacing:-.01em;line-height:1;white-space:nowrap}
.brand-sub{color:var(--muted);font-size:13px}
.tabs{display:flex;gap:2px;background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:3px}
.tabs button{font-weight:600;font-size:14px;line-height:1;border:0;background:transparent;color:var(--muted);padding:9px 14px;border-radius:999px;cursor:pointer}
.tabs button[aria-selected="true"]{background:var(--pill);color:var(--ink)}
.top-right{margin-left:auto;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
main{flex:1;min-height:0;overflow:auto;padding-block:18px}
main.is-work{overflow:hidden;padding-block:12px}

.chip{display:inline-flex;align-items:center;gap:6px;font-weight:500;font-size:12px;line-height:1;;padding:6px 10px;border-radius:999px;background:var(--raised);color:var(--ink);border:1px solid var(--line);white-space:nowrap}
.chip i{width:8px;height:8px;border-radius:50%;background:var(--bc,var(--accent))}
button.chip{cursor:pointer;min-height:32px}
.warnchip{--bc:var(--warn)}
.mono{font-family:var(--f-body);font-variant-numeric:tabular-nums}
.sec{margin:0;font-weight:500;font-size:14px;color:var(--muted)}

.btn{font-weight:500;font-size:14px;line-height:1.1;padding:12px 16px;border-radius:6px;border:1px solid var(--line);background:var(--raised);color:var(--ink);cursor:pointer;min-height:48px}
.btn:hover{border-color:var(--muted)}
.btn:disabled{opacity:.4;cursor:default}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.big{flex:1 1 220px;font-size:17px;font-weight:500;min-height:56px}
.btn.small{min-height:36px;padding:8px 12px;font-size:13px}
.btn.armed{background:var(--warn);border-color:var(--warn);color:var(--on-warn)}

.bar{height:8px;background:var(--track);border-radius:99px;overflow:hidden}
.bar span{display:block;height:100%;width:0;background:var(--bc,var(--accent));border-radius:inherit;transition:width .2s linear}

/* Übersicht und Packliste */
.page{max-width:1100px;margin:0 auto;display:grid;grid-template-columns:minmax(0,1fr);gap:30px}
.ov-dyn{display:grid;grid-template-columns:minmax(0,1fr);gap:30px;min-width:0}
.page h1{font-family:var(--f-display);font-weight:700;font-size:28px;line-height:1.1;letter-spacing:-.02em;margin:4px 0 8px;text-wrap:balance}
.page h2{font-family:var(--f-display);font-weight:500;font-size:16px;margin:0 0 12px;text-wrap:balance}
.lede{margin:0;max-width:62ch;color:var(--muted)}
.intro{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:20px;align-items:end}
.facts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin:0}
.facts div{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:12px;display:flex;flex-direction:column;justify-content:space-between;gap:4px}
.facts dt{font-size:12px;color:var(--muted)}
.facts dd{margin:0;font-family:var(--f-body);font-weight:400;font-size:24px;font-variant-numeric:tabular-nums;white-space:nowrap}
.strip{display:flex;gap:3px;border-radius:8px;overflow:hidden}
.seg{flex:1 1 0;min-width:84px;background:var(--bc);color:var(--on-bath);padding:12px 10px;display:flex;flex-direction:column;gap:2px}
.seg-name{font-family:var(--f-display);font-weight:500;font-size:15px;line-height:1.1;hyphens:manual}
.seg-time{font-family:var(--f-body);font-size:13px}
.strip-axis{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);margin-top:6px;font-family:var(--f-body)}
.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:8px;background:var(--panel)}
table{width:100%;border-collapse:collapse;min-width:640px}
th{text-align:left;font-size:12px;font-weight:600;;color:var(--muted);padding:10px 12px;border-bottom:1px solid var(--line)}
td{padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:top}
tr:last-child td{border-bottom:0}
td.num{font-family:var(--f-body);font-variant-numeric:tabular-nums;white-space:nowrap}
.stepname{display:flex;align-items:center;gap:10px;font-weight:600}
.stepname b{font-family:var(--f-body);font-weight:500;color:var(--muted);font-size:13px;min-width:1.6em}
.stepname i{width:10px;height:10px;border-radius:50%;background:var(--bc);flex:none}
.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:28px}
.rules,.notes{margin:0;padding-left:20px;display:grid;gap:8px;max-width:65ch}
.notes{color:var(--muted)}
.settings{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:14px}
.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.field>span:first-child{font-size:12px;font-weight:600;color:var(--muted)}
.field input[type=text],.field input[type=number],.field select,.field textarea{width:100%;padding:10px;border:1px solid var(--line);border-radius:8px;background:var(--raised);min-height:44px}
.field.check{flex-direction:row;align-items:center;gap:10px}
.field.wide{grid-column:1/-1}
.err{font-size:12px;color:var(--warn);min-height:1em}
.set-actions{grid-column:1/-1;display:flex;gap:8px;flex-wrap:wrap}
.cta{display:flex;gap:10px;flex-wrap:wrap;justify-content:flex-end}
input[type=checkbox]{width:22px;height:22px;accent-color:var(--accent);flex:none;margin:0}

.pack-head{display:flex;align-items:flex-end;gap:16px 24px;flex-wrap:wrap}
.pack-progress{flex:1 1 220px;display:grid;gap:6px;font-weight:600}
.packgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:14px}
.packgroup{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:14px}
.packgroup h3{font-family:var(--f-display);font-weight:500;font-size:16px;margin:0 0 8px}
.packgroup ul{list-style:none;margin:0;padding:0;display:grid;gap:4px}
.packgroup label{display:flex;gap:10px;align-items:flex-start;padding:6px 0;cursor:pointer}
.packgroup input:checked+span{color:var(--muted)}

/* Arbeitsweg */
.work{height:100%;display:grid;grid-template-columns:112px minmax(0,1fr) minmax(220px,.5fr);gap:14px}
.road{display:flex;flex-direction:column;gap:2px;overflow:auto;padding-block:2px;min-height:0}
.stop{position:relative;display:grid;grid-template-columns:20px minmax(0,1fr);column-gap:8px;align-items:center;text-align:left;background:none;border:0;padding:6px 4px;border-radius:8px;color:var(--muted);cursor:pointer;min-height:44px}
.stop .dot{grid-row:1/3;width:14px;height:14px;border-radius:50%;border:2px solid var(--bc);background:var(--panel);justify-self:center;position:relative;z-index:1}
.stop:not(:last-child)::after{content:"";position:absolute;left:13px;top:calc(50% + 7px);height:calc(100% - 12px);width:2px;background:var(--line)}
.stop.done::after{background:var(--bc)}
.stop.done .dot{background:var(--bc)}
.stop.now{background:var(--pill);color:var(--ink)}
.stop.now .dot{width:18px;height:18px;background:var(--bc)}
.stop .lbl{font-family:var(--f-display);font-weight:500;font-size:14px;line-height:1.1;hyphens:manual}
.stop .lbl:last-child{grid-row:1/3}
.stop .dur{font-family:var(--f-body);font-size:11px;color:var(--muted);line-height:1.2}
.stop.now .dur{color:var(--ink)}

.now-panel,.next-panel{background:var(--panel);border:1px solid var(--line);border-radius:8px;min-height:0;overflow:auto;display:flex;flex-direction:column}
.now-panel{padding:14px 18px 0;container-type:inline-size}
.now-head{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.stepno{font-size:13px;color:var(--muted)}
.now-title{font-family:var(--f-display);font-weight:700;font-size:28px;line-height:1.1;letter-spacing:-.02em;margin:8px 0 12px;text-wrap:balance}
.now-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.2fr);gap:14px;align-items:stretch}
@container (max-width:470px){.now-grid{grid-template-columns:minmax(0,1fr)}}
.clock{display:flex;flex-direction:column;gap:8px;justify-content:center;min-width:0;container-type:inline-size}
.clock-lbl{font-weight:600;font-size:12px;;color:var(--muted)}
.clock-val{font-family:var(--f-body);font-weight:500;font-size:min(clamp(56px,16vh,136px),34cqi);line-height:1;font-variant-numeric:tabular-nums;letter-spacing:-.03em;white-space:nowrap}
.clock.over .clock-val{color:var(--warn)}
.cue{border-radius:8px;padding:14px 16px;display:flex;flex-direction:column;gap:8px;background:var(--raised);border:1px solid var(--line);min-height:150px;min-width:0;container-type:inline-size}
.cue-body{display:flex;gap:12px;align-items:flex-start}
.cue-text{flex:1 1 auto;min-width:0;display:grid;gap:8px;container-type:inline-size}
.cue-main{font-family:var(--f-display);font-weight:700;font-size:min(clamp(24px,4.6vh,36px),13cqi);letter-spacing:-.01em;line-height:1.02;;overflow-wrap:break-word;hyphens:auto}
.cue-detail{font-size:15px}
.metro{flex:none;width:clamp(56px,min(15vh,28cqi),108px);display:grid;justify-items:center;gap:2px}
.metro svg{width:100%;height:auto;display:block;overflow:visible}
.metro-track{fill:none;stroke:currentColor;stroke-opacity:.35;stroke-width:5}
.metro-dot{fill:currentColor}
.metro.idle .metro-dot{fill-opacity:.35}
.metro-num{fill:currentColor;font-family:var(--f-body);font-weight:600;font-size:20px}
.metro-cap{font-size:11px;line-height:1.2;text-align:center}
.cue.is-rot,.cue.is-drain,.cue.is-cont,.cue.is-fill{background:var(--bc);border-color:var(--bc);color:var(--on-bath)}
.cue.is-rot .bar,.cue.is-drain .bar,.cue.is-cont .bar,.cue.is-fill .bar{background:color-mix(in srgb,var(--on-bath) 25%,transparent)}
.cue.is-rot .bar span,.cue.is-drain .bar span,.cue.is-cont .bar span,.cue.is-fill .bar span{background:var(--on-bath)}
.cue.is-done{background:var(--raised);border-color:var(--ok)}
.rot{margin-top:auto;display:grid;gap:6px}
.rot-row{display:flex;justify-content:space-between;align-items:baseline;gap:8px;font-weight:600}
.rot-row .mono{font-size:26px}
.rot-count{font-size:12px}
.extra{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-top:14px;align-items:start}
.hint{margin:0;font-size:14px;align-self:center}
.hint.ok{color:var(--ok)} .hint.warn{color:var(--warn)}
.proto-box{grid-column:1/-1;border:1px solid var(--line);border-radius:10px;background:var(--raised);overflow:hidden}
.proto-head{display:flex;justify-content:space-between;align-items:center;padding:8px 10px;border-bottom:1px solid var(--line);font-weight:600;font-size:13px}
.proto-box pre{margin:0;padding:10px;font-family:var(--f-body);font-size:12.5px;white-space:pre-wrap;overflow-wrap:anywhere}
.todo{list-style:none;padding:0;margin:16px 0 0;display:grid;gap:8px}
.todo li{position:relative;padding-left:18px;max-width:72ch}
.todo li::before{content:"";position:absolute;left:2px;top:.55em;width:7px;height:7px;border-radius:2px;background:var(--bc)}
.todo.check li{padding-left:0}
.todo.check li::before{display:none}
.todo label{display:flex;gap:10px;align-items:flex-start;cursor:pointer;padding:2px 0}
.todo input:checked+span{color:var(--muted)}
.controls{position:sticky;bottom:0;margin-top:auto;display:flex;gap:10px;flex-wrap:wrap;padding-block:14px;background:var(--panel);border-top:1px solid var(--line)}
.portrait-hint{display:none;margin:0 0 4px;font-size:13px;color:var(--muted)}

.next-panel{padding:16px;gap:12px}
.next-card{border:1px solid var(--line);background:var(--raised);border-radius:8px;padding:14px;display:grid;gap:8px}
.next-card h3{font-family:var(--f-display);font-weight:700;font-size:22px;letter-spacing:-.01em;line-height:1.05;margin:0}
.next-dur{margin:0;font-family:var(--f-body);font-size:14px}
.next-card ul{margin:0;padding-left:18px;display:grid;gap:4px}
.mini{margin:4px 0 0;font-size:12px;font-weight:600;;color:var(--muted)}
.pour{margin:0;font-size:14px}
.eta{font-size:14px;color:var(--muted)}
.eta b{font-family:var(--f-body);font-size:22px;color:var(--ink);font-weight:600}
.later{list-style:none;margin:0;padding:0;display:grid;gap:2px}
.later li{display:grid;grid-template-columns:10px minmax(0,1fr) auto;gap:10px;align-items:center;padding:6px 0;border-bottom:1px solid var(--line);font-size:14px}
.later li:last-child{border-bottom:0}
.later i{width:10px;height:10px;border-radius:50%;background:var(--bc)}
.later .mono{color:var(--muted);font-size:13px}

.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(18px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-weight:600;z-index:20;max-width:calc(100% - 32px)}

@media (max-height:540px) and (min-width:761px){
  .top{padding-block:6px}
  .mark{font-size:21px}
  .tabs button{padding:7px 11px;font-size:13px}
  .now-panel{padding:10px 12px 0}
  .now-title{margin:4px 0 8px}
  .clock-val{font-size:min(clamp(44px,18vh,96px),34cqi)}
  .cue{min-height:0;padding:10px 12px}
  .cue-main{font-size:min(24px,16cqi)}
  .metro-cap{display:none}
  .todo{font-size:13.5px;gap:4px;margin-top:10px}
  .stop{padding:3px 4px;min-height:0}
  .stop .lbl{font-size:13px}
  .controls{padding-block:8px}
  .btn{min-height:42px;padding:9px 12px}
  .btn.big{min-height:46px;font-size:16px}
}
@media (max-width:760px){
  .intro{grid-template-columns:minmax(0,1fr)}
  main.is-work{overflow:auto}
  .work{height:auto;grid-template-columns:minmax(0,1fr)}
  .road{flex-direction:row;overflow-x:auto;padding-bottom:4px}
  .stop{grid-template-columns:auto;justify-items:center;text-align:center;min-width:76px;row-gap:4px}
  .stop .dot,.stop .lbl:last-child{grid-row:auto}
  .stop:not(:last-child)::after{display:none}
  .now-panel,.next-panel{overflow:visible}
}
@media (max-width:760px) and (orientation:portrait){
  .portrait-hint{display:block}
}
@media (max-width:420px){
  .facts{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
  .brand-sub{display:none}
}
@media (prefers-reduced-motion: reduce){
  .bar span{transition:none}
}
</style>
</head>
<body>
<div class="shell">
  <header class="top">
    <div class="brand"><span class="mark">C-41 · 30 °C</span><span class="brand-sub">Adox C-TEC 41 · Paterson-Doppeltank</span></div>
    <nav class="tabs" role="tablist" aria-label="Bereiche">
      <button role="tab" id="tab-uebersicht" data-act="tab" data-tab="uebersicht">Übersicht</button>
      <button role="tab" id="tab-packliste" data-act="tab" data-tab="packliste">Packliste</button>
      <button role="tab" id="tab-arbeitsweg" data-act="tab" data-tab="arbeitsweg">Arbeitsweg</button>
    </nav>
    <div class="top-right">
      <button id="runChip" class="chip b-dev" data-act="tab" data-tab="arbeitsweg" hidden></button>
      <span id="heatChip" class="chip b-water" hidden></span>
      <button id="soundWarn" class="chip warnchip" data-act="unlock" hidden><i></i>Ton aus – hier tippen</button>
      <button id="soundBtn" class="btn small" data-act="sound" aria-pressed="true">Ton an</button>
    </div>
  </header>
  <main id="view"></main>
</div>
<div id="toast" class="toast" role="status" aria-live="polite" hidden></div>

<script>
(function(){
'use strict';
var KEY='c41-ablauf-30-v1';
var DEF={devTime:480,filmNo:1,films:1,volume:500,agInitial:10,agInterval:30,agCount:4,agTempo:2,sound:true};
var TABS=['uebersicht','packliste','arbeitsweg'];
var NSTEPS=10;
var S=load();
var fired=new Set();
var armed={};
var view=document.getElementById('view');

/* ---------- Hilfsfunktionen ---------- */
function esc(s){return String(s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function fmt(sec){sec=Math.max(0,Math.round(sec));var m=Math.floor(sec/60),s=sec%60;return m+':'+String(s).padStart(2,'0');}
function parseTime(v){
  v=String(v).trim().replace(',','.');
  if(/^\d{1,2}:\d{1,2}$/.test(v)){var p=v.split(':').map(Number);return p[1]>59?null:p[0]*60+p[1];}
  if(/^\d+(\.\d+)?$/.test(v))return Math.round(parseFloat(v)*60);
  return null;
}
function dec(n,d){return Number(n).toFixed(d).replace('.',',');}
function clamp(n,a,b){n=Math.round(Number(n));if(!isFinite(n))return a;return Math.min(b,Math.max(a,n));}
function clampHalf(n,a,b){n=Math.round(Number(String(n).replace(',','.'))*2)/2;if(!isFinite(n))return a;return Math.min(b,Math.max(a,n));}

function events(c){
  var D=c.duration,s=S.settings,E=[],v=s.volume,tp=s.agTempo;
  if(c.mode==='invert'){
    var iv=Math.max(10,s.agInterval),iEnd=Math.min(10+s.agInitial,D-10);
    var cyc=Math.min(Math.max(3,Math.round(s.agCount*tp)),iv-3);
    var n=Math.max(1,Math.min(s.agCount,Math.floor(cyc/tp)));
    E.push({at:0,end:10,cue:'Einfüllen',detail:s.agInitial>0?'Zügig durch den Trichter gießen, Kappe drauf.':'Zügig durch den Trichter gießen, Kappe drauf, 2× fest aufklopfen.',kind:'fill'});
    if(iEnd>10)E.push({at:10,end:iEnd,cue:'Durchgehend kippen',detail:'Im Takt des Kreises. Danach 2× fest aufklopfen.',kind:'cont',spin:Math.max(1,Math.floor((iEnd-10)/tp))});
    for(var t=iv;t+cyc<=D-10;t+=iv){if(t<iEnd)continue;E.push({at:t,end:t+cyc,cue:'Jetzt '+n+'× kippen',detail:'Im Takt des Kreises, mit leichter Drehung. Dann zurück ins Bad.',kind:'rot',spin:n});}
    E.push({at:D-10,end:D,cue:'Ausgießen',detail:'Zurück in die '+c.pourTo+'.',kind:'drain'});
  }else if(c.mode==='wash'){
    var wk=Math.round(10*tp),e1=Math.min(10+wk,57);
    E.push({at:0,end:10,cue:'Wasser einfüllen',detail:'28–32 °C, Tank voll machen.',kind:'fill'});
    E.push({at:10,end:e1,cue:'10× kippen',detail:'Im Takt des Kreises. Danach stehen lassen bis zum nächsten Wechsel.',kind:'cont',spin:Math.max(1,Math.min(10,Math.floor((e1-10)/tp)))});
    for(var w=60;w<=D-60;w+=60){
      var ce=Math.min(w+15+wk,w+57,D-10);
      E.push({at:w,end:w+15,cue:'Wasser wechseln',detail:'Ausgießen, frisch füllen, Kappe drauf.',kind:'rot'});
      E.push({at:w+15,end:ce,cue:'10× kippen',detail:'Im Takt des Kreises. Danach stehen lassen.',kind:'cont',spin:Math.max(1,Math.min(10,Math.floor((ce-w-15)/tp)))});
    }
    E.push({at:D-10,end:D,cue:'Ausgießen',detail:'Wasser in den Abfluss.',kind:'drain'});
  }else if(c.mode==='gentle'){
    E.push({at:0,end:10,cue:'Einfüllen',detail:'Ruhig eingießen, Kappe drauf.',kind:'fill'});
    E.push({at:10,end:20,cue:'Sanft kippen',detail:'Langsam im Takt des Kreises. Nicht schütteln, der Stabilisator schäumt.',kind:'cont',spin:Math.max(1,Math.floor(10/tp))});
    E.push({at:D-10,end:D,cue:'Ausgießen',detail:'Zurück in die '+c.pourTo+'.',kind:'drain'});
  }else{
    E.push({at:0,end:10,cue:'Wasser einfüllen',detail:v+' ml, 30 °C.',kind:'fill'});
    E.push({at:10,end:D-10,cue:'Sanft durchgehend kippen',detail:'Im Takt des Kreises. So werden Tank und Spiralen warm.',kind:'cont',spin:Math.max(1,Math.floor((D-20)/tp))});
    E.push({at:D-10,end:D,cue:'Ausgießen',detail:'Vollständig in den Abfluss, kurz abtropfen lassen.',kind:'drain'});
  }
  return E;
}

var ac=null;
function audio(){
  if(!ac){try{ac=new (window.AudioContext||window.webkitAudioContext)();}catch(e){ac=null;}}
  if(ac&&ac.state!=='running'&&ac.state!=='closed'){try{var r=ac.resume();if(r&&r.catch)r.catch(function(){});}catch(e){}}
  return ac;
}
function beep(f,d,delay,force){
  if(!S.settings.sound&&!force)return;
  var a=audio();if(!a)return;
  try{
    var o=a.createOscillator(),g=a.createGain(),t0=a.currentTime+(delay||0);
    o.type='sine';o.frequency.value=f;
    g.gain.setValueAtTime(0.0001,t0);g.gain.exponentialRampToValueAtTime(0.45,t0+0.012);g.gain.exponentialRampToValueAtTime(0.0001,t0+d);
    o.connect(g);g.connect(a.destination);o.start(t0);o.stop(t0+d+0.03);
  }catch(e){}
}

}

/* ---------- Timer ---------- */
function elapsed(){return (S.before+(S.running?Date.now()-S.startedAt:0))/1000;}
function start(){audio();wake();if(!S.runDate)S.runDate=Date.now();S.running=true;S.startedAt=Date.now();save();renderWork();}
function pause(){S.before+=Date.now()-S.startedAt;S.running=false;save();renderWork();}
function goto(i,autostart){
  var st=steps();if(i<0||i>=st.length)return;
  var c=st[S.step];
  if(c&&c.kind==='timed'){var e=elapsed();if(e>0)S.actual[c.id]=e;}
  S.step=i;S.running=false;S.before=0;S.startedAt=0;fired.clear();
  if(autostart)start();else{save();renderWork();}
}
function busy(){var c=steps()[S.step];return c.kind==='timed'&&S.running&&elapsed()<c.duration;}
function partial(){var c=steps()[S.step],t=elapsed();return c.kind==='timed'&&!S.running&&t>0&&t<c.duration;}
function nav(d,btn){
  var j=S.step+d;if(j<0||j>=NSTEPS)return;
  if(busy()){toast('Der Timer läuft. Erst pausieren.');return;}
  if(partial()){
    if(btn)confirmBtn(btn,'nav'+d,'Zeit verwerfen?',function(){goto(j,false);});
    else toast('Schritt ist angefangen. Zum Wechseln den Knopf zweimal tippen.');
    return;
  }
  goto(j,false);
}
function jump(j){
  if(j===S.step)return;
  if(busy()){toast('Der Timer läuft. Erst pausieren.');return;}
  if(partial()){toast('Schritt ist angefangen ('+fmt(elapsed())+'). Erst „Zeit zurücksetzen“.');return;}
  goto(j,false);
}
function fire(key,at,t,fn,win){if(fired.has(key))return;if(t>=at){fired.add(key);if(t-at<win)fn();}}
function signals(c,t){
  events(c).forEach(function(e){
    if(e.kind==='fill')return;
    var id=c.id+'|'+e.kind+'|'+e.at;
    if(e.kind==='rot'||e.kind==='drain'){[3,2,1].forEach(function(p){fire(id+'|p'+p,e.at-p,t,function(){beep(660,0.08);},1.2);});}
    fire(id+'|go',e.at,t,function(){
      if(e.kind==='drain'){beep(520,0.3);beep(520,0.3,0.4);vib([250,100,250]);}
      else{beep(1040,0.35);vib(200);}
    },Math.max(1.2,e.end-e.at));
  });
  fire(c.id+'|end',c.duration,t,function(){beep(880,0.2);beep(880,0.2,0.3);beep(1180,0.45,0.6);vib([300,100,300,100,300]);},5);
}

function updateTempHint(){
  var h=document.getElementById('tempHint');if(!h)return;
  var v=parseFloat(S.temp);
  if(!isFinite(v)){h.className='hint';h.textContent='Wert eintragen, er kommt ins Protokoll.';return;}
  var d=Math.round((v-30)*10)/10;
  if(Math.abs(d)<=0.3){h.className='hint ok';h.textContent='Passt. Abweichung höchstens 0,3 °C.';}
  else{h.className='hint warn';h.textContent=(d>0?'Zu warm':'Zu kalt')+' um '+dec(Math.abs(d),1)+' °C. Warten, bis der Entwickler 30 °C hat.';}
}

    if(S.running)return 'Pause';
    return t>0?'Fortsetzen':'Start – jetzt eingießen';
  }
  if(c.id==='heat')return S.heatStart?'Weiter: Film einspulen':'Heizen läuft – weiter';
  if(c.id==='hang')return 'Hängt – weiter';
  return 'Erledigt – weiter';

function primary(btn){
  audio();
  var st=steps(),i=S.step,c=st[i],n=st[i+1];
  if(!n){confirmBtn(btn,'primary','Wirklich neu beginnen?',newRun);return;}

    if(t>=c.duration){goto(i+1,n.kind==='timed');return;}
    if(S.running)pause();else start();

  }

}

/* ---------- Takt ---------- */
function setText(id,txt){var el=document.getElementById(id);if(el&&el.textContent!==txt)el.textContent=txt;}
function tick(){
  var st=steps(),i=S.step,c=st[i],n=st[i+1],t=elapsed();
  if(!c)return;
  if(c.kind==='timed'&&S.running)signals(c,t);

  var chip=document.getElementById('heatChip');
  if(S.heatStart&&i<stepIndex('dev')){chip.hidden=false;var ht='<i></i>Bad heizt seit '+fmt((Date.now()-S.heatStart)/1000);if(chip.innerHTML!==ht)chip.innerHTML=ht;}else chip.hidden=true;
  var rc=document.getElementById('runChip');
  if(c.kind==='timed'&&S.running&&S.tab!=='arbeitsweg'){
    rc.hidden=false;rc.className='chip b-'+c.bath;
    var rt='<i></i>'+c.title+' · '+(t<c.duration?fmt(Math.ceil(c.duration-t)):'fertig');
    if(rc.innerHTML!==rt)rc.innerHTML=rt;
  }else rc.hidden=true;
  document.getElementById('soundWarn').hidden=!(S.running&&S.settings.sound&&(!ac||ac.state!=='running'));

  if(S.tab!=='arbeitsweg')return;
  var cue=document.getElementById('cue');if(!cue)return;
  var clock=document.getElementById('clock'),rotWrap=document.getElementById('rotWrap'),stepBar=document.getElementById('stepBar'),rotBar=document.getElementById('rotBar');
  var tone='rest';
  if(c.kind==='timed'){
    var D=c.duration,E=events(c);
    clock.classList.toggle('over',t>=D);
    setText('clockVal',t<D?fmt(Math.ceil(D-t)):'+'+fmt(t-D));
    setText('clockLbl',t>=D?'Über der Zeit':S.running?'Restzeit':t>0?'Pausiert':'Bereit – Start beim Eingießen');
    stepBar.style.width=Math.min(100,t/D*100)+'%';
    var rots=E.filter(function(e){return e.kind==='rot';});
    var rotDone=rots.filter(function(e){return e.at<=t;}).length;
    var cntTxt=rots.length?(c.mode==='wash'?'Wasserwechsel ':'Rotation ')+rotDone+' von '+rots.length:'';
    if(t>=D){
      tone='done';rotWrap.hidden=true;
      setText('cueMain','Fertig');
      setText('cueDetail',n?(n.kind==='timed'?'Tank leer? Dann '+n.title+' starten, sobald du eingießt.':'Weiter zum nächsten Schritt.'):'');
    }else if(t===0&&!S.running){
      tone='ready';rotWrap.hidden=false;
      setText('cueMain','Bereit');setText('cueDetail','Start drücken, sobald du eingießt. Bewegung: '+c.move+'.');
      setText('rotLbl',rots.length?(c.mode==='wash'?'Wasserwechsel geplant':'Rotationen geplant'):'Dauer');
      setText('rotVal',rots.length?String(rots.length):fmt(D));
      rotBar.style.width='0%';setText('rotCount','');
    }else{
      rotWrap.hidden=false;
      var act=null;E.forEach(function(e){if(t>=e.at&&t<e.end)act=e;});
      var nxt=null;for(var k=0;k<E.length;k++){if(E[k].at>t&&(E[k].kind==='rot'||E[k].kind==='drain')){nxt=E[k];break;}}
      if(act){
        tone=act.kind;
        setText('cueMain',act.cue);setText('cueDetail',(S.running?'':'Pausiert. ')+act.detail);
        var lbl=act.kind==='rot'?(c.mode==='wash'?'Wechseln – noch':'Kippen – noch'):act.kind==='drain'?'Ausgießen – noch':act.kind==='fill'?'Einfüllen – noch':'Noch';
        setText('rotLbl',lbl);setText('rotVal',fmt(Math.ceil(act.end-t)));
        rotBar.style.width=Math.min(100,(t-act.at)/(act.end-act.at)*100)+'%';
      }else{
        var r=REST[c.mode];
        setText('cueMain',r[0]);setText('cueDetail',(S.running?'':'Pausiert. ')+r[1]);
        if(nxt){
          var prev=0;E.forEach(function(e){if(e.end<=t&&e.end>prev)prev=e.end;});
          setText('rotLbl',nxt.kind==='drain'?'Ausgießen in':(c.mode==='wash'?'Nächster Wasserwechsel in':'Nächste Rotation in'));
          setText('rotVal',fmt(Math.ceil(nxt.at-t)));
          rotBar.style.width=Math.min(100,Math.max(0,(t-prev)/(nxt.at-prev)*100))+'%';
        }
      }
      setText('rotCount',cntTxt);
    }
  }else{
    rotWrap.hidden=true;clock.classList.remove('over');
    var total=c.todo.length,on=0;for(var j=0;j<total;j++)if(S.checks[c.id+'-'+j])on++;
    stepBar.style.width=(total?on/total*100:0)+'%';
    tone=on===total?'done':'rest';
    setText('cueMain',on===total?'Alles erledigt':on+' von '+total+' erledigt');
    setText('cueDetail',on===total?'Weiter zum nächsten Schritt.':'Abhaken, dann weiter.');
    if((c.id==='load'||c.id==='measure'||c.id==='heat')&&S.heatStart){setText('clockLbl','Bad heizt seit');setText('clockVal',fmt((Date.now()-S.heatStart)/1000));}
    else if(c.id==='clean'&&S.dryStart){setText('clockLbl','Film trocknet seit (2–4 h)');setText('clockVal',fmt((Date.now()-S.dryStart)/1000));}
    else if(c.id==='heat'){setText('clockLbl','Aufheizen: 30–45 min');setText('clockVal','–:––');}
    else{setText('clockLbl',c.est||'Ohne Zeitvorgabe');setText('clockVal','–:––');}
  }
  var cls='cue is-'+tone;if(cue.className!==cls)cue.className=cls;
  var pb=document.getElementById('primary');
  if(pb&&!armed.primary){
    var lab=primaryLabel(st,i,t);if(pb.textContent!==lab)pb.textContent=lab;
    pb.classList.toggle('primary',!(c.kind==='timed'&&S.running&&t<c.duration));
  }
  var rem=0;if(c.kind==='timed')rem+=Math.max(0,c.duration-t);
  st.slice(i+1).forEach(function(x){if(x.kind==='timed')rem+=x.duration;});
  var eta=document.getElementById('eta');
  if(eta){
    if(rem>0){
      var at=new Date(Date.now()+rem*1000).toLocaleTimeString('de-DE',{hour:'2-digit',minute:'2-digit'});
      var pre=(c.kind!=='timed'||(t===0&&!S.running))?'Bei Start jetzt ist die Nasschemie fertig um ':'Nasschemie fertig um ';
      var html=pre+'<b>'+at+'</b> · noch '+fmt(rem)+' min';
      if(eta.innerHTML!==html)eta.innerHTML=html;
    }else if(eta.innerHTML!=='')eta.innerHTML='';
  }
}

function metroFrame(){
  requestAnimationFrame(metroFrame);
  if(S.tab!=='arbeitsweg')return;
  var m=document.getElementById('metro');if(!m)return;
  var c=steps()[S.step];if(!c||c.kind!=='timed')return;
  var t=elapsed(),act=null;
  if(t<c.duration)events(c).forEach(function(e){if(t>=e.at&&t<e.end)act=e;});
  var g=document.getElementById('metroRot'),num=document.getElementById('metroNum');
  if(act&&act.spin){
    var p=(t-act.at)/S.settings.agTempo,k=Math.min(act.spin,Math.floor(p)+1),txt=k+'/'+act.spin;
    g.setAttribute('transform','rotate('+((p%1)*360).toFixed(1)+' 50 50)');
    if(num.textContent!==txt)num.textContent=txt;
    m.classList.remove('idle');
  }else{
    g.setAttribute('transform','rotate(0 50 50)');
    if(num.textContent!=='')num.textContent='';
    m.classList.add('idle');
  }
}

  if(a==='prev'||a==='next'){nav(a==='prev'?-1:1,b);return;}
  if(a==='jump'){jump(Number(b.dataset.i));return;}
  if(a==='reset'){confirmBtn(b,'reset','Wirklich zurücksetzen?',function(){S.running=false;S.before=0;S.startedAt=0;fired.clear();save();renderWork();});return;}
  if(a==='testsound'){audio();beep(660,0.08,0,true);beep(660,0.08,0.25,true);beep(1040,0.35,0.5,true);vib(200);return;}
  if(a==='defaults'){var s=S.settings;S.settings=Object.assign({},DEF,{filmNo:s.filmNo,films:s.films,volume:s.volume,devTime:s.devTime,sound:s.sound});save();renderOverview();toast('Bewegung auf Standard zurückgesetzt.');return;}
  if(a==='packreset'){confirmBtn(b,'packreset','Wirklich alles abwählen?',function(){S.pack={};save();renderPack();});return;}
  if(a==='copy'){
    var txt=protocol(),pre=document.getElementById('proto');
    var sel=function(){try{var r=document.createRange();r.selectNodeContents(pre);var w=window.getSelection();w.removeAllRanges();w.addRange(r);toast('Text markiert. Jetzt kopieren.');}catch(x){}};
    try{navigator.clipboard.writeText(txt).then(function(){toast('Protokoll kopiert.');},sel);}catch(x){sel();}
    return;
  }
});
document.addEventListener('change',function(e){
  var el=e.target,s=S.settings;
  if(el.dataset.pk){S.pack[el.dataset.pk]=el.checked;save();updatePackCount();return;}
  if(el.dataset.ck){S.checks[el.dataset.ck]=el.checked;save();tick();return;}
  if(el.id==='set-dev'||el.id==='devInline'){
    var v=parseTime(el.value),err=document.getElementById(el.id+'-err');
    if(v&&v>=60&&v<=1800){s.devTime=v;save();el.value=fmt(v);if(err)err.textContent='';refreshDynamic();}
    else if(err)err.textContent='Bitte als m:ss eingeben, zum Beispiel 8:00.';
    return;
  }
  var spec=NUMS[el.id];
  if(spec){
    var raw=String(el.value).trim().replace(',','.');
    if(raw===''||!isFinite(Number(raw))){el.value=s[spec[0]];return;}
    s[spec[0]]=spec[3]?clampHalf(raw,spec[1],spec[2]):clamp(raw,spec[1],spec[2]);
    el.value=s[spec[0]];
  }else if(el.id==='set-vol'){s.volume=el.value==='300'?300:500;if(s.volume===300){s.films=1;setVal('set-films','1');}}
  else if(el.id==='set-films'){s.films=el.value==='2'?2:1;if(s.films===2&&s.volume===300){s.volume=500;setVal('set-vol','500');}}
  else if(el.id==='set-sound'){s.sound=el.checked;save();updateSoundBtn();tick();return;}
  else return;
  save();refreshDynamic();
});
document.addEventListener('input',function(e){
  if(e.target.id==='temp'){S.temp=e.target.value;save();updateTempHint();}
  if(e.target.id==='notes'){S.notes=e.target.value;save();updateProto();}
});
document.addEventListener('submit',function(e){e.preventDefault();});
document.addEventListener('keydown',function(e){
  if(S.tab!=='arbeitsweg')return;
  var tg=e.target.tagName;if(tg==='INPUT'||tg==='TEXTAREA'||tg==='SELECT')return;
  if(e.code==='Space'){
    var inTop=e.target.closest&&e.target.closest('.top');
    if(tg==='BUTTON'&&!inTop)return;
    e.preventDefault();if(e.repeat)return;
    var p=document.getElementById('primary');if(p)p.click();
  }else if(e.key==='ArrowRight'){if(!e.repeat)nav(1);}
  else if(e.key==='ArrowLeft'){if(!e.repeat)nav(-1);}
});
window.addEventListener('hashchange',function(){var h=location.hash.slice(1);if(TABS.indexOf(h)>=0&&h!==S.tab)setTab(h);});

var h=(location.hash||'').slice(1);if(TABS.indexOf(h)>=0)S.tab=h;
render();
setInterval(tick,200);
requestAnimationFrame(metroFrame);
})();
</script>
</body>
</html>
