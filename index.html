<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Ablaufplan für Film-Entwicklung: C-41 bei 30 °C (Adox C-TEC 41) und Schwarz-Weiß bei 20 °C (Adonal / Rodinal, Adofix, Adoflo) mit Timer, Push-Rechner und Rotationssignalen.">
<meta name="theme-color" media="(prefers-color-scheme: light)" content="#eef1f5">
<meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0b0d10">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='34' r='24' fill='%231F6C9E'/%3E%3Crect x='26' y='2' width='12' height='8' rx='2' fill='%231F6C9E'/%3E%3Cpath d='M32 34V18' stroke='white' stroke-width='5' stroke-linecap='round'/%3E%3C/svg%3E">
<style>
:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0}
[hidden]{display:none!important}
img{max-width:100%}
</style>
<title>Filmentwicklung · C-41 &amp; S/W (Rodinal · Adofix · Adoflo)</title>
<style>
:root{
  /* Stil: achromatic ledger (taste-skill). Hoher Kontrast auf Laborgrau, klare Hierarchie, Bäder farbcodiert. */
  --bg:#eef1f5; --panel:#ffffff; --raised:#f7f9fb; --ink:#090b0e; --muted:#3e4550; --line:#dfe3e8; --control:#6b7280;
  --accent:#090b0e; --on-accent:#ffffff; --pill:#dfe4ec;
  --dev:#8E4F05; --blix:#8F2543; --water:#1554AD; --stab:#216939; --prep:#49505a; --on-bath:#ffffff;
  --warn:#b91c22; --on-warn:#ffffff; --ok:#1e7030;
  --track:#dde2e9; --shade:#dfe3e8;
  --f-display:"Helvetica Neue",Helvetica,Arial,sans-serif;
  --f-body:"Helvetica Neue",Helvetica,Arial,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#08090b; --panel:#121417; --raised:#1a1d22; --ink:#f9fafb; --muted:#c8cdd5; --line:#25272b; --control:#787e87;
    --accent:#f9fafb; --on-accent:#08090b; --pill:#272b33;
    --dev:#F0AD52; --blix:#F288A1; --water:#76B0FA; --stab:#80D69A; --prep:#aeb5c0; --on-bath:#08090b;
    --warn:#f26479; --on-warn:#08090b; --ok:#4bd184;
    --track:#252930; --shade:#25272b;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#08090b; --panel:#121417; --raised:#1a1d22; --ink:#f9fafb; --muted:#c8cdd5; --line:#25272b; --control:#787e87;
  --accent:#f9fafb; --on-accent:#08090b; --pill:#272b33;
  --dev:#F0AD52; --blix:#F288A1; --water:#76B0FA; --stab:#80D69A; --prep:#aeb5c0; --on-bath:#08090b;
  --warn:#f26479; --on-warn:#08090b; --ok:#4bd184;
  --track:#252930; --shade:#25272b;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5;font-variant-numeric:tabular-nums}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}

.b-dev{--bc:var(--dev)} .b-blix{--bc:var(--blix)} .b-water{--bc:var(--water)} .b-stab{--bc:var(--stab)} .b-prep{--bc:var(--prep)}

.shell{height:100%;display:flex;flex-direction:column;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.top{display:flex;align-items:center;gap:10px 14px;padding-block:10px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;min-width:0;flex-wrap:wrap}
.proc-switch{display:inline-flex;gap:2px;background:var(--panel);border:1px solid var(--control);border-radius:8px;padding:3px}
.proc-switch button{font-family:var(--f-display);font-weight:700;font-size:14px;line-height:1.1;border:0;background:transparent;color:var(--muted);padding:7px 12px;border-radius:6px;cursor:pointer;min-height:34px;white-space:nowrap}
.proc-switch button[aria-pressed="true"]{background:var(--accent);color:var(--on-accent)}
.brand-sub{color:var(--muted);font-size:13px;font-weight:700}
.tabs{display:flex;gap:2px;background:var(--panel);border:1px solid var(--control);border-radius:999px;padding:3px}
.tabs button{font-weight:700;font-size:14px;line-height:1;border:0;background:transparent;color:var(--muted);padding:9px 14px;border-radius:999px;cursor:pointer;min-height:34px}
.tabs button[aria-selected="true"]{background:var(--accent);color:var(--on-accent)}
.top-right{margin-left:auto;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
main{flex:1;min-height:0;overflow:auto;padding-block:18px}
main.is-work{overflow:hidden;padding-block:12px}

.chip{display:inline-flex;align-items:center;gap:6px;font-weight:700;font-size:12.5px;line-height:1;padding:6px 11px;border-radius:999px;background:var(--raised);color:var(--ink);border:1px solid var(--control);white-space:nowrap}
.chip i{width:9px;height:9px;border-radius:50%;background:var(--bc,var(--accent));flex:none}
button.chip{cursor:pointer;min-height:34px}
.warnchip{--bc:var(--warn)}
.mono{font-family:var(--f-body);font-variant-numeric:tabular-nums}
.sec{margin:0;font-weight:700;font-size:13px;color:var(--muted);letter-spacing:.01em}

.btn{font-weight:700;font-size:14.5px;line-height:1.15;padding:11px 16px;border-radius:6px;border:1px solid var(--control);background:var(--raised);color:var(--ink);cursor:pointer;min-height:46px;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.btn:hover{border-color:var(--ink)}
.btn:disabled{opacity:.42;cursor:default}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.big{flex:1 1 210px;font-size:17px;font-weight:700;min-height:54px}
.btn.small{min-height:36px;padding:7px 12px;font-size:13px}
.btn.armed{background:var(--warn);border-color:var(--warn);color:var(--on-warn)}
.kbd{font-size:12px;font-weight:400;opacity:.82}

.bar{height:10px;background:var(--track);border-radius:99px;overflow:hidden}
.bar span{display:block;height:100%;width:0;background:var(--bc,var(--accent));border-radius:inherit;transition:width .2s linear}

/* Übersicht und Packliste */
.page{max-width:1120px;margin:0 auto;display:grid;grid-template-columns:minmax(0,1fr);gap:28px}
.ov-dyn{display:grid;grid-template-columns:minmax(0,1fr);gap:28px;min-width:0}
.page h1{font-family:var(--f-display);font-weight:700;font-size:28px;line-height:1.12;letter-spacing:-.02em;margin:4px 0 8px;text-wrap:balance}
.page h2{font-family:var(--f-display);font-weight:700;font-size:20px;line-height:1.2;margin:0 0 12px;text-wrap:balance}
.lede{margin:0;max-width:65ch;color:var(--muted);font-size:15.5px;line-height:1.5}
.intro{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:20px;align-items:end}
.facts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin:0}
.facts div{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:12px 14px;display:flex;flex-direction:column;justify-content:space-between;gap:4px}
.facts dt{font-size:12.5px;font-weight:700;color:var(--muted)}
.facts dd{margin:0;font-family:var(--f-body);font-weight:700;font-size:22px;font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.strip{display:flex;gap:4px;border-radius:8px;overflow:hidden}
.seg{flex:1 1 0;min-width:78px;background:var(--bc);color:var(--on-bath);padding:12px 10px;display:flex;flex-direction:column;gap:3px;position:relative}
.seg.is-now{outline:3px solid var(--ink);outline-offset:-3px}
.seg-name{font-family:var(--f-display);font-weight:700;font-size:15px;line-height:1.15;hyphens:manual}
.seg-time{font-family:var(--f-body);font-size:13.5px;font-weight:700}
.strip-axis{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;font-size:12.5px;font-weight:700;color:var(--muted);margin-top:6px;font-family:var(--f-body)}
.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:8px;background:var(--panel)}
table{width:100%;border-collapse:collapse;min-width:640px}
th{text-align:left;font-size:12.5px;font-weight:700;color:var(--muted);padding:11px 12px;border-bottom:1px solid var(--line)}
td{padding:11px 12px;border-bottom:1px solid var(--line);vertical-align:top;font-size:14.5px}
tr:last-child td{border-bottom:0}
tr.is-now td{background:var(--raised);font-weight:700}
th.num,td.num{text-align:right;font-family:var(--f-body);font-variant-numeric:tabular-nums;white-space:nowrap}
.stepname{display:flex;align-items:center;gap:10px;font-weight:700}
.stepname b{font-family:var(--f-body);font-weight:700;color:var(--muted);font-size:13px;min-width:1.6em}
.stepname i{width:10px;height:10px;border-radius:50%;background:var(--bc);flex:none}
.now-tag{display:inline-block;margin-left:8px;padding:2px 8px;border-radius:99px;font-size:12px;font-weight:700;background:var(--accent);color:var(--on-accent)}
.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:28px}
.rules,.notes{margin:0;padding-left:20px;display:grid;gap:9px;max-width:65ch;font-size:15px;line-height:1.5}
.notes{color:var(--muted)}
.settings{display:grid;grid-template-columns:repeat(auto-fit,minmax(155px,1fr));gap:12px;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:16px}
.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.field>span:first-child{font-size:12.5px;font-weight:700;color:var(--muted)}
.field input[type=text],.field input[type=number],.field select,.field textarea{width:100%;padding:9px 11px;border:1px solid var(--control);border-radius:6px;background:var(--raised);min-height:44px;font-weight:700}
.field textarea{font-weight:400}
.field.check{flex-direction:row;align-items:center;gap:10px}
.field.wide{grid-column:1/-1}
.err{font-size:12px;color:var(--warn);min-height:1em;font-weight:700}
.set-actions{grid-column:1/-1;display:flex;gap:8px;flex-wrap:wrap}
.mix-banner{grid-column:1/-1;background:var(--raised);border:1px solid var(--line);border-left:5px solid var(--dev);border-radius:6px;padding:11px 14px;display:grid;gap:4px}
.mix-banner b{font-size:16px}
.mix-banner span{font-size:13.5px;color:var(--muted)}
.cta{display:flex;gap:10px;flex-wrap:wrap;justify-content:flex-end}
input[type=checkbox]{width:22px;height:22px;accent-color:var(--accent);flex:none;margin:0}

.logopen{display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap;background:var(--panel);border:2px solid var(--ink);border-radius:8px;padding:14px 16px}
.pack-head{display:flex;align-items:flex-end;gap:16px 24px;flex-wrap:wrap}
.pack-progress{flex:1 1 220px;display:grid;gap:6px;font-weight:700}
.packgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:14px}
.packgroup{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:14px}
.packgroup h3{font-family:var(--f-display);font-weight:700;font-size:16px;margin:0 0 8px}
.packgroup ul{list-style:none;margin:0;padding:0;display:grid;gap:4px}
.packgroup label{display:flex;gap:10px;align-items:flex-start;padding:6px 0;cursor:pointer;font-size:15px}
.packgroup input:checked+span{color:var(--muted)}

/* Arbeitsweg */
.work{height:100%;display:grid;grid-template-columns:138px minmax(0,1fr) minmax(240px,.48fr);grid-template-rows:auto minmax(0,1fr);gap:14px}
.lab{grid-column:1/-1;display:flex;align-items:center;gap:18px;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:8px 16px;min-width:0}
.lab svg{height:88px;width:auto;flex:none;display:block}
.lab .part{transition:opacity .2s}
.lab .part.off{opacity:.22}
.lab .lab-line{stroke:var(--ink);stroke-width:1.5;fill:none}
.lab .lab-on .lab-line{stroke-width:2.2}
.lab .lab-bath{fill:var(--bg);stroke:var(--line);stroke-width:1.5}
.lab .lab-on .lab-bath{stroke:var(--ink);stroke-width:2.2}
.lab text{fill:var(--ink);font-size:12px;font-weight:700;font-family:var(--f-body)}
.lab-cap{display:grid;gap:3px;min-width:0;flex:1 1 auto}
.lab-cap-top{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.lab-cap b{font-size:16px}
.lab-cap span{color:var(--muted);font-size:14px}
.key-hint{margin-left:auto;font-size:12.5px;color:var(--muted);font-weight:700;white-space:nowrap}

.road{display:flex;flex-direction:column;gap:4px;overflow:auto;padding:2px;min-height:0}
.stop{position:relative;display:grid;grid-template-columns:22px minmax(0,1fr);column-gap:8px;align-items:center;text-align:left;background:transparent;border:1px solid transparent;padding:7px 8px;border-radius:8px;color:var(--muted);cursor:pointer;min-height:46px}
.stop:hover{background:var(--raised);color:var(--ink)}
.stop .dot{grid-row:1/3;width:14px;height:14px;border-radius:50%;border:2px solid var(--bc);background:var(--panel);justify-self:center;position:relative;z-index:1}
.stop:not(:last-child)::after{content:"";position:absolute;left:18px;top:calc(50% + 7px);height:calc(100% - 10px);width:2px;background:var(--line)}
.stop.done{color:var(--ink)}
.stop.done::after{background:var(--bc)}
.stop.done .dot{background:var(--bc)}
.stop.now{background:var(--pill);color:var(--ink);outline:2px solid var(--bc);outline-offset:-2px}
.stop.now .dot{width:18px;height:18px;background:var(--bc);border-color:var(--ink)}
.stop .lbl{font-family:var(--f-display);font-weight:700;font-size:13.5px;line-height:1.15;hyphens:manual}
.stop .lbl:last-child{grid-row:1/3}
.stop .dur{font-family:var(--f-body);font-size:12px;font-weight:700;color:var(--muted);line-height:1.2}
.stop.now .dur{color:var(--ink)}

.now-panel,.next-panel{background:var(--panel);border:1px solid var(--line);border-radius:8px;min-height:0;overflow:auto;display:flex;flex-direction:column}
.now-panel{padding:0 18px;container-type:inline-size}
.now-prog{height:6px;background:var(--track);margin:0 -18px 12px;overflow:hidden;flex:none}
.now-prog span{display:block;height:100%;background:var(--bc);transition:width .25s ease}
.now-head{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.stepno{font-size:13.5px;font-weight:700;color:var(--ink);background:var(--pill);padding:5px 11px;border-radius:99px}
.now-title{font-family:var(--f-display);font-weight:700;font-size:28px;line-height:1.1;letter-spacing:-.02em;margin:8px 0 10px;text-wrap:balance}
.now-meta{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 12px}
.meta-pill{display:inline-flex;align-items:center;gap:5px;padding:5px 10px;border-radius:6px;background:var(--raised);border:1px solid var(--line);font-size:13.5px;font-weight:700;color:var(--ink)}
.meta-pill span{color:var(--muted);font-weight:700;font-size:12px}
.now-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.25fr);gap:14px;align-items:stretch}
.now-grid.is-prep{grid-template-columns:minmax(0,.75fr) minmax(0,1.45fr)}
@container (max-width:480px){.now-grid,.now-grid.is-prep{grid-template-columns:minmax(0,1fr)}}
.clock{display:flex;flex-direction:column;gap:8px;justify-content:center;min-width:0;container-type:inline-size;background:var(--raised);border:1px solid var(--line);border-radius:8px;padding:12px 14px}
.clock-lbl{font-weight:700;font-size:13px;color:var(--muted)}
.clock-val{font-family:var(--f-body);font-weight:700;font-size:min(clamp(54px,14vh,124px),32cqi);line-height:1;font-variant-numeric:tabular-nums;letter-spacing:-.03em;white-space:nowrap}
.clock.is-prep .clock-val{font-size:clamp(24px,4vh,34px);letter-spacing:-.01em}
.clock.over .clock-val{color:var(--warn)}
.cue{border-radius:8px;padding:14px 16px;display:flex;flex-direction:column;gap:8px;background:var(--raised);border:1px solid var(--line);min-height:136px;min-width:0;container-type:inline-size}
.cue.is-prep{min-height:0}
.cue-body{display:flex;gap:12px;align-items:flex-start}
.cue-text{flex:1 1 auto;min-width:0;display:grid;gap:6px;container-type:inline-size}
.cue-main{font-family:var(--f-display);font-weight:700;font-size:min(clamp(22px,4.2vh,34px),13cqi);letter-spacing:-.01em;line-height:1.08;overflow-wrap:break-word;hyphens:auto}
.cue-detail{font-size:15.5px;line-height:1.4}
.metro{flex:none;width:clamp(56px,min(14vh,26cqi),100px);display:grid;justify-items:center;gap:2px}
.metro svg{width:100%;height:auto;display:block;overflow:visible}
.metro-track{fill:none;stroke:currentColor;stroke-opacity:.35;stroke-width:5}
.metro-dot{fill:currentColor}
.metro.idle .metro-dot{fill-opacity:.35}
.metro-num{fill:currentColor;font-family:var(--f-body);font-weight:700;font-size:20px}
.metro-cap{font-size:12px;line-height:1.2;text-align:center}
.cue.is-rot,.cue.is-drain,.cue.is-cont,.cue.is-fill{background:var(--bc);border-color:var(--bc);color:var(--on-bath)}
.cue.is-rot .bar,.cue.is-drain .bar,.cue.is-cont .bar,.cue.is-fill .bar{background:color-mix(in srgb,var(--on-bath) 25%,transparent)}
.cue.is-rot .bar span,.cue.is-drain .bar span,.cue.is-cont .bar span,.cue.is-fill .bar span{background:var(--on-bath)}
.cue.is-done{background:var(--raised);border:2px solid var(--ok)}
.rot{margin-top:auto;display:grid;gap:6px}
.rot-row{display:flex;justify-content:space-between;align-items:baseline;gap:8px;font-weight:700;font-size:14px}
.rot-row .mono{font-size:24px}
.rot-count{font-size:12.5px;font-weight:700}
.extra{display:grid;grid-template-columns:repeat(auto-fit,minmax(155px,1fr));gap:10px;margin-top:12px;align-items:start;background:var(--raised);border:1px solid var(--line);border-radius:8px;padding:12px}
.hint{margin:0;font-size:14px;font-weight:700;align-self:center;grid-column:1/-1}
.hint.ok{color:var(--ok)} .hint.warn{color:var(--warn)}
.proto-box{grid-column:1/-1;border:1px solid var(--line);border-radius:8px;background:var(--panel);overflow:hidden}
.proto-head{display:flex;justify-content:space-between;align-items:center;padding:8px 10px;border-bottom:1px solid var(--line);font-weight:700;font-size:13px}
.proto-box pre{margin:0;padding:10px;font-family:var(--f-body);font-size:13px;white-space:pre-wrap;overflow-wrap:anywhere}
.todo{list-style:none;padding:0;margin:14px 0 0;display:grid;gap:8px;font-size:16.5px;line-height:1.45}
.todo li{position:relative;padding:9px 12px 9px 14px;max-width:74ch;background:var(--raised);border:1px solid var(--line);border-left:4px solid var(--bc);border-radius:6px}
.todo.check li{padding:8px 12px}
.todo label{display:flex;gap:12px;align-items:flex-start;cursor:pointer}
.todo input:checked+span{color:var(--muted);text-decoration:line-through}
.controls{position:sticky;bottom:0;margin-top:auto;display:flex;gap:10px;flex-wrap:wrap;padding-block:12px;background:var(--panel);border-top:1px solid var(--line)}
.portrait-hint{display:none;margin:0 0 6px;font-size:13px;color:var(--muted)}

.next-panel{padding:16px;gap:12px}
.next-card{border:1px solid var(--line);border-left:5px solid var(--bc);background:var(--raised);border-radius:8px;padding:14px;display:grid;gap:8px}
.next-card h3{font-family:var(--f-display);font-weight:700;font-size:21px;letter-spacing:-.01em;line-height:1.1;margin:0}
.next-dur{margin:0;font-family:var(--f-body);font-size:14.5px;font-weight:700}
.next-card ul{margin:0;padding-left:18px;display:grid;gap:4px;font-size:14.5px}
.mini{margin:4px 0 0;font-size:12.5px;font-weight:700;color:var(--muted)}
.pour{margin:0;font-size:14px;font-weight:700}
.eta{font-size:14px;color:var(--muted)}
.eta b{font-family:var(--f-body);font-size:21px;color:var(--ink);font-weight:700}
.later{list-style:none;margin:0;padding:0;display:grid;gap:2px}
.later li{display:grid;grid-template-columns:10px minmax(0,1fr) auto;gap:10px;align-items:center;padding:7px 0;border-bottom:1px solid var(--line);font-size:14px}
.later li:last-child{border-bottom:0}
.later i{width:10px;height:10px;border-radius:50%;background:var(--bc)}
.later .mono{color:var(--muted);font-size:13px;font-weight:700}

.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(18px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-weight:700;z-index:20;max-width:calc(100% - 32px)}

@media (max-width:920px){
  .intro{grid-template-columns:minmax(0,1fr)}
  main.is-work{overflow:auto}
  .work{height:auto;grid-template-columns:minmax(0,1fr);grid-template-rows:auto}
  .lab{flex-wrap:wrap;gap:10px}
  .lab svg{height:64px;max-width:100%}
  .key-hint{display:none}
  .road{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:4px;overflow:visible;padding:0}
  .stop{grid-template-columns:minmax(0,1fr);justify-items:center;text-align:center;min-width:0;min-height:52px;padding:6px 3px;row-gap:3px;border:1px solid var(--line);background:var(--panel)}
  .stop .dot,.stop .lbl:last-child{grid-row:auto}
  .stop .lbl{font-size:12px;max-width:100%;overflow:hidden;text-overflow:ellipsis}
  .stop:not(:last-child)::after{display:none}
  .now-panel,.next-panel{overflow:visible}
  .controls{position:static}
}
@media (max-width:920px) and (orientation:portrait){
  .portrait-hint{display:block}
}
@media (max-width:640px){
  .strip{display:grid;grid-template-columns:repeat(auto-fit,minmax(96px,1fr));gap:4px}
  .seg{min-width:0;border-radius:6px}
}
@media (max-width:460px){
  .facts{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
  .brand-sub{display:none}
}
@media (prefers-reduced-motion: reduce){
  .bar span,.now-prog span{transition:none}
}

<body>
<div class="shell">
  <header class="top">
    <div class="brand">
      <div class="proc-switch" role="group" aria-label="Prozess wählen">
        <button type="button" id="proc-c41" data-act="proc" data-proc="c41" aria-pressed="true">C-41 · 30 °C</button>
        <button type="button" id="proc-bw" data-act="proc" data-proc="bw" aria-pressed="false">S/W · Rodinal 20 °C</button>
      </div>
      <span class="brand-sub" id="brandSub">Adox C-TEC 41 · Paterson-Doppeltank</span>
    </div>
    <nav class="tabs" role="tablist" aria-label="Bereiche">
      <button role="tab" id="tab-uebersicht" data-act="tab" data-tab="uebersicht">Übersicht</button>
      <button role="tab" id="tab-packliste" data-act="tab" data-tab="packliste">Packliste</button>
      <button role="tab" id="tab-arbeitsweg" data-act="tab" data-tab="arbeitsweg">Arbeitsweg</button>
      <button role="tab" id="tab-logbuch" data-act="tab" data-tab="logbuch">Logbuch</button>
    </nav>
    <div class="top-right">
      <button id="runChip" class="chip b-dev" data-act="tab" data-tab="arbeitsweg" hidden></button>

      <button id="soundWarn" class="chip warnchip" data-act="unlock" hidden><i></i>Ton aus – hier tippen</button>
      <button id="themeBtn" class="btn small" data-act="theme">Design: Auto</button>
      <button id="soundBtn" class="btn small" data-act="sound" aria-pressed="true">Ton an</button>
    </div>
  </header>
  <main id="view"></main>
</div>
<div id="toast" class="toast" role="status" aria-live="polite" hidden></div>

<script>
(function(){
'use strict';
var KEY='c41-ablauf-30-v1';
var DEF={
  devTime:480,blixTime:360,filmNo:1,films:1,volume:500,agInitial:10,agInterval:30,agCount:4,agTempo:2,sound:true,
  bwFilm:'hp5',bwDil:'1+25',bwPush:0,bwPushMode:'time',bwDevTime:360,bwConcMl:20,bwFixTime:300,bwFixDil:'1+7',bwWashTime:360,
  bwAgInitial:60,bwAgInterval:30,bwAgCount:4
};
var BW_FILMS={
  hp5:{name:'Ilford HP5 Plus',iso:400,note:'MDC 6:00 / Rodinal-Blatt 8:00 (1+25)',t:{'1+25':{'-1':270,'0':360,'1':480,'2':720,'3':1080},'1+50':{'-1':510,'0':660,'1':870,'2':1200,'3':1800}}},
  trix:{name:'Kodak Tri-X 400',iso:400,note:'MDC 7:00 (1+25) · 13:30 (1+50)',t:{'1+25':{'-1':330,'0':420,'1':570,'2':780,'3':1110},'1+50':{'-1':630,'0':810,'1':1050,'2':1410,'3':1920}}},
  p3200:{name:'Kodak T-Max P3200',iso:3200,note:'Rodinal-Blatt 8:00 (1+25) · 16:00 (1+50) bei EI 3200',t:{'1+25':{'-1':390,'0':480,'1':660,'2':900,'3':1200},'1+50':{'-1':780,'0':960,'1':1320,'2':1740,'3':2280}}},
  apx400:{name:'Agfa APX 400',iso:400,note:'Rodinal-Blatt 10:00 (1+25) · 20:00 (1+50)',t:{'1+25':{'-1':450,'0':600,'1':840,'2':1140,'3':1560},'1+50':{'-1':900,'0':1200,'1':1620,'2':2160,'3':2700}}},
  foma400:{name:'Fomapan 400',iso:400,note:'MDC 5:30 (1+25) · 11:00 (1+50)',t:{'1+25':{'-1':270,'0':330,'1':480,'2':690,'3':990},'1+50':{'-1':510,'0':660,'1':960,'2':1320,'3':1800}}},
  custom:{name:'Eigene Werte (frei)',iso:400,note:'Zeit und Rodinal-Menge frei einstellbar',t:{'1+25':{'-1':360,'0':480,'1':660,'2':900,'3':1200},'1+50':{'-1':660,'0':840,'1':1140,'2':1500,'3':2100}}}
};
var CONC_MUL={'-1':0.75,'0':1,'1':1.5,'2':2.0,'3':2.5};
var TABS=['uebersicht','packliste','arbeitsweg','logbuch'];
var LOGKEY='c41-logbuch-v1';
var S=load();
var fired=new Set();
var armed={};
var view=document.getElementById('view');

/* ---------- Hilfsfunktionen ---------- */
function esc(s){return String(s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function fmt(sec){sec=Math.max(0,Math.round(sec));var m=Math.floor(sec/60),s=sec%60;return m+':'+String(s).padStart(2,'0');}
function parseTime(v){
  v=String(v).trim().replace(',','.');
  if(/^\d{1,2}:\d{1,2}$/.test(v)){var p=v.split(':').map(Number);return p[1]>59?null:p[0]*60+p[1];}
  if(/^\d+(\.\d+)?$/.test(v))return Math.round(parseFloat(v)*60);
  return null;
}
function dec(n,d){return Number(n).toFixed(d).replace('.',',');}
function clamp(n,a,b){n=Math.round(Number(n));if(!isFinite(n))return a;return Math.min(b,Math.max(a,n));}
function clampHalf(n,a,b){n=Math.round(Number(String(n).replace(',','.'))*2)/2;if(!isFinite(n))return a;return Math.min(b,Math.max(a,n));}
function numOr(v,def,a,b,half){if(typeof v!=='number'||!isFinite(v))return def;return half?clampHalf(v,a,b):clamp(v,a,b);}
function obj(v){return v&&typeof v==='object'&&!Array.isArray(v)?v:{};}

function baseConcMl(vol,dil){return Math.round((vol/(dil==='1+50'?50:25))*2)/2;}
function calcBwRecipe(s){
  var f=BW_FILMS[s.bwFilm]||BW_FILMS.hp5;
  var dil=s.bwDil==='1+50'?'1+50':'1+25';
  var pk=String(s.bwPush);
  var baseT=(f.t[dil]&&f.t[dil]['0'])||480;
  var pushT=(f.t[dil]&&f.t[dil][pk])||baseT;
  var baseMl=baseConcMl(s.volume,dil);
  var mul=CONC_MUL[pk]||1;
  var concMl=s.bwPushMode==='conc'?Math.max(5,Math.round(baseMl*mul*2)/2):baseMl;
  var devSec=s.bwPushMode==='conc'?baseT:pushT;
  return {devTime:devSec,concMl:concMl,baseT:baseT,pushT:pushT,baseMl:baseMl};
}
function effDilTxt(vol,ml){
  if(!ml||ml<=0)return '1+25';
  var r=Math.round(vol/ml);
  return '1+'+Math.max(1,r);
}
function targetIso(s){
  var f=BW_FILMS[s.bwFilm]||BW_FILMS.hp5,base=f.iso||400,p=s.bwPush;
  var v=Math.round(base*Math.pow(2,p));
  if(base===3200&&p===2)v=12500;
  if(base===3200&&p===3)v=25000;
  return v;
}
function pushLabel(p){
  if(p===0)return '±0 (Nenn-ISO)';
  return (p>0?'+'+p:String(p))+' '+(Math.abs(p)===1?'Blende':'Blenden')+(p>0?' Push':' Pull');
}
function rodinalTempTime(t20,tempC){
  /* Diagramm 2 im Adox Rodinal-Datenblatt (18–24 °C): ca. -11,5 % pro +1 °C */
  return Math.round(t20*Math.pow(0.885,tempC-20));
}

function load(){
  var d=null;
  try{d=JSON.parse(localStorage.getItem(KEY)||'null');}catch(e){}
  d=obj(d);
  var st=Object.assign({proc:'c41',theme:'auto',tab:'uebersicht',step:0,running:false,startedAt:0,before:0,pack:{},checks:{},actual:{},heatStart:0,dryStart:0,temp:'',notes:'',runDate:0},d);
  st.proc=st.proc==='bw'?'bw':'c41';
  st.theme=(st.theme==='light'||st.theme==='dark')?st.theme:'auto';
  st.step=Number.isInteger(st.step)?Math.max(0,st.step):0;
  if(TABS.indexOf(st.tab)<0)st.tab='uebersicht';
  st.pack=obj(st.pack);st.checks=obj(st.checks);st.actual=obj(st.actual);
  st.running=st.running===true;
  ['startedAt','before','heatStart','dryStart','runDate'].forEach(function(k){var n=Number(st[k]);st[k]=isFinite(n)&&n>0?n:0;});
  if(st.running&&!st.startedAt)st.running=false;
  st.temp=typeof st.temp==='string'?st.temp:'';
  st.notes=typeof st.notes==='string'?st.notes:'';
  var r=obj(d.settings),s={};
  s.devTime=numOr(r.devTime,DEF.devTime,60,3600);
  s.blixTime=numOr(r.blixTime,DEF.blixTime,60,3600);
  s.filmNo=numOr(r.filmNo,DEF.filmNo,1,99);
  s.volume=r.volume===300?300:500;
  s.films=r.films===2&&s.volume===500?2:1;
  s.agInitial=numOr(r.agInitial,DEF.agInitial,0,60);
  s.agInterval=numOr(r.agInterval,DEF.agInterval,10,120);
  s.agCount=numOr(r.agCount,DEF.agCount,1,10);
  s.agTempo=numOr(r.agTempo,DEF.agTempo,1,4,true);
  s.sound=r.sound!==false;
  s.bwFilm=BW_FILMS[r.bwFilm]?r.bwFilm:DEF.bwFilm;
  s.bwDil=r.bwDil==='1+50'?'1+50':'1+25';
  s.bwPush=numOr(r.bwPush,DEF.bwPush,-1,3);
  s.bwPushMode=r.bwPushMode==='conc'?'conc':'time';
  var rec=calcBwRecipe(s);
  s.bwDevTime=numOr(r.bwDevTime,rec.devTime,60,5400);
  s.bwConcMl=numOr(r.bwConcMl,rec.concMl,3,100,true);
  s.bwFixTime=numOr(r.bwFixTime,DEF.bwFixTime,60,1800);
  s.bwFixDil=r.bwFixDil==='1+4'?'1+4':'1+7';
  s.bwWashTime=numOr(r.bwWashTime,DEF.bwWashTime,60,1800);
  s.bwAgInitial=numOr(r.bwAgInitial,DEF.bwAgInitial,0,120);
  s.bwAgInterval=numOr(r.bwAgInterval,DEF.bwAgInterval,10,120);
  s.bwAgCount=numOr(r.bwAgCount,DEF.bwAgCount,1,10);
  st.settings=s;
  return st;
}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}}
function isBw(){return S.proc==='bw';}
function tempoTxt(){var t=S.settings.agTempo;return dec(t,t%1?1:0)+' s';}
function moveTxt(){
  var s=S.settings;
  var ini=isBw()?s.bwAgInitial:s.agInitial;
  var iv=isBw()?s.bwAgInterval:s.agInterval;
  var cnt=isBw()?s.bwAgCount:s.agCount;
  return (ini>0?'erst '+ini+' s durchgehend, dann ':'')+'alle '+iv+' s '+cnt+'×, '+tempoTxt()+' pro Kippen';
}
function filmRange(){var s=S.settings;return 'Nr. '+s.filmNo+(s.films===2?'–'+(s.filmNo+1):'');}
function bwMixTxt(){
  var s=S.settings,v=s.volume,ml=s.bwConcMl,w=Math.max(0,v-ml);
  var eff=effDilTxt(v,ml);
  return dec(ml,ml%1?1:0)+' ml Rodinal + '+dec(w,w%1?1:0)+' ml Wasser = '+v+' ml ('+eff+')';
}
function fixMixTxt(){
  var s=S.settings,v=s.volume,d=s.bwFixDil==='1+4'?5:8;
  var fml=Math.round(v/d),wml=v-fml;
  return fml+' ml Adofix + '+wml+' ml Wasser ('+s.bwFixDil+')';
}
function floMixTxt(){
  var v=S.settings.volume,ml=v===300?1.5:2.5;
  return dec(ml,1)+' ml Adoflo auf '+v+' ml Wasser (1+200)';
}

/* ---------- Ablauf ---------- */
function stepsC41(){
  var s=S.settings,v=s.volume;
  var devStart=s.agInitial>0?'Zügig einfüllen, Kappe drauf, '+s.agInitial+' s durchgehend kippen, dann 2× fest aufklopfen.':'Zügig einfüllen, Kappe drauf, 2× fest aufklopfen.';
  return [
  {id:'heat',short:'Heizen',chip:'Vorbereitung',title:'Wasserbad aufheizen',bath:'prep',kind:'prep',est:'30–45 min',temp:'30,0 °C',
   todo:['CineStill TCS in die Wanne, Wasser bis knapp unter die Flaschenhälse, auf 30,0 °C stellen.',
         'Flaschen DEV, BLIX und STAB ins Bad stellen, immer in dieser Reihenfolge von links nach rechts.',
         'Etwa 4 l Wasser für Vorwärmen und Wässern auf 30 °C bringen: Krug mit ins Bad oder am Hahn mischen und messen.',
         'Das Aufheizen dauert 30–45 min. In der Zeit spulst du den Film ein.'],
   prepare:['TCS, Wanne, Flaschen','Krug für das Waschwasser']},
  {id:'load',short:'Einspulen',chip:'Vorbereitung',title:'Film einspulen',bath:'prep',kind:'prep',est:'5–10 min',
   todo:['Hände, Spiralen und Tank müssen trocken sein.',
         'Im Wechselsack oder komplett dunklen Raum: Film auf die Spirale, Spirale auf die Mittelsäule, in den Tank, Trichterdeckel fest aufdrücken.',
         'Nur ein Kleinbildfilm im Doppeltank: die leere zweite Spirale obendrauf setzen, damit die Filmspirale nicht hochrutscht.',
         'Licht erst an, wenn der Deckel sicher sitzt.'],
   prepare:['Wechselsack oder dunkler Raum','Schere, Filmrückholer, Spiralen, Tank, Deckel']},
  {id:'measure',short:'Messen',chip:'Vorbereitung',title:'Temperatur prüfen und abmessen',bath:'prep',kind:'prep',est:'5 min',temp:'30,0 °C',
   todo:['Handschuhe an, Fenster auf.',
         'Entwickler in der Flasche mit dem zweiten Thermometer messen. Ziel: 30,0 °C. Die Anzeige des TCS allein reicht nicht.',
         v+' ml DEV, '+v+' ml BLIX und '+v+' ml STAB in die beschrifteten Becher füllen und zurück ins Bad stellen.',
         'Entwicklerzeit und Blix-Zeit unten prüfen: Film 1 = 8:00 DEV / 6:00 BLIX. Ab Film 2 die Zeit aus der Adox-Tabelle eintragen.',
         'Trichter und Tank griffbereit. Ab dem Vorwärmen läuft alles ohne Pause durch.'],
   prepare:['Zweites Thermometer','3 Becher: DEV, BLIX, STAB','Handschuhe']},
  {id:'prewarm',short:'Vor­wärmen',chip:'Wasser',title:'Tank vorwärmen',bath:'water',kind:'timed',duration:60,mode:'continuous',temp:'30 °C',move:'durchgehend sanft',pourTo:'Abfluss',mix:v+' ml Wasser',
   todo:[v+' ml Wasser mit 30 °C einfüllen.',
         'Sanft durchgehend kippen, im Takt des Kreises, damit Tank und Spiralen warm werden.',
         'Vollständig ausgießen und kurz abtropfen lassen. Restwasser verdünnt sonst den Entwickler.'],
   prepare:[v+' ml Wasser, 30 °C, im Krug']},
  {id:'dev',short:'Ent­wickler',chip:'DEV',title:'Entwickler (C-TEC 41)',bath:'dev',kind:'timed',duration:s.devTime,mode:'invert',temp:'30,0 °C',move:moveTxt(),pourTo:'DEV-Flasche',mix:v+' ml DEV',
   todo:['Die Uhr läuft vom Beginn des Eingießens bis zum Ende des Ausgießens. So rechnet auch Adox.',
         devStart,
         'Alle '+s.agInterval+' s: '+s.agCount+'× kippen mit leichter Drehung, im Takt des Kreises. Dazwischen steht der Tank im Bad, Wasser unter dem Trichterdeckel.',
         '10 s vor Ende ausgießen, zurück in die DEV-Flasche. Flasche randvoll machen oder Luft herausdrücken.'],
   prepare:['DEV-Becher, '+v+' ml, 30 °C','Trichter DEV','Start drücken, sobald du eingießt']},
  {id:'blix',short:'Blix',chip:'BLIX',title:'Bleichfixierbad (Blix)',bath:'blix',kind:'timed',duration:s.blixTime,mode:'invert',temp:'30 °C',move:moveTxt(),pourTo:'BLIX-Flasche',mix:v+' ml BLIX',
   todo:['Direkt nach dem Entwickler einfüllen, ohne Zwischenwässern.',
         'Bewegung wie beim Entwickler: '+moveTxt()+'.',
         'Die Blix-Zeit nicht verkürzen. Zu kurz lässt Silber im Film.',
         '10 s vor Ende ausgießen, zurück in die BLIX-Flasche. Nie in den DEV-Becher oder DEV-Trichter.'],
   prepare:['BLIX-Becher, '+v+' ml','Trichter BLIX','Start drücken, sobald du eingießt']},
  {id:'wash',short:'Wässern',chip:'Wasser',title:'Wässern',bath:'water',kind:'timed',duration:360,mode:'wash',temp:'28–32 °C',move:'6 Füllungen, je 10× kippen',pourTo:'Abfluss',mix:'6× '+v+' ml',
   todo:['Der Film ist jetzt fixiert, Licht schadet nicht mehr. Zum Kippen bleiben Deckel und Kappe drauf.',
         'Wasser mit 28–32 °C, Tank jedes Mal voll machen.',
         'Jede Minute wechseln: ausgießen, frisch füllen, 10× kippen im Takt des Kreises. Das sind 6 Füllungen.',
         'Das Waschwasser kommt in den Abfluss.'],
   prepare:['ca. 3,5 l Wasser, 28–32 °C','Freier Weg zum Abfluss']},
  {id:'stab',short:'Stabi',chip:'STAB',title:'Stabilisator',bath:'stab',kind:'timed',duration:60,mode:'gentle',temp:'30 °C / Raumtemp.',move:'erste 10 s sanft',pourTo:'STAB-Flasche',mix:v+' ml STAB',
   todo:['Einfüllen und die ersten 10 s sanft kippen. Nicht schütteln, der Stabilisator schäumt.',
         'Danach ruhen lassen.',
         '10 s vor Ende ausgießen, zurück in die STAB-Flasche.',
         'Danach nicht mehr wässern.'],
   prepare:['STAB-Becher, '+v+' ml','Trichter STAB']},
  {id:'hang',short:'Auf­hängen',chip:'Trocknen',title:'Film aufhängen',bath:'prep',kind:'prep',est:'2–4 h trocknen',
   todo:['Spirale öffnen, den Film nur an den Rändern anfassen.',
         'Oben eine Filmklammer, unten eine als Gewicht.',
         'Nicht abstreifen oder abwischen.',
         'Staubarm trocknen lassen, zum Beispiel im Bad nach kurzem Duschen. Dauer 2–4 h.'],
   prepare:['2 Filmklammern pro Film','Staubarmer Platz zum Aufhängen']},
  {id:'clean',short:'Protokoll',chip:'Abschluss',title:'Aufräumen und Protokoll',bath:'prep',kind:'prep',est:'10 min',
   todo:['Strichliste auf DEV-, BLIX- und STAB-Flasche: ein Strich pro Film.',
         'Flaschen voll und luftdicht verschließen, dunkel lagern.',
         'Becher, Trichter, Tank und Spiralen gründlich mit Wasser spülen und offen trocknen lassen.',
         'Handschuhe aus, Hände waschen.',
         'Erschöpften Blix nicht in den Abfluss gießen. Er enthält Silber und gehört zur Schadstoffsammelstelle.'],
   prepare:['Wasserfester Stift für die Strichliste','Protokoll in dieser App']}
  ];
}

function stepsBW(){
  var s=S.settings,v=s.volume,f=BW_FILMS[s.bwFilm]||BW_FILMS.hp5;
  var devStart=s.bwAgInitial>0?'Zügig einfüllen, Kappe drauf, erste '+s.bwAgInitial+' s durchgehend kippen, dann 2× fest aufklopfen (Luftblasen lösen).':'Zügig einfüllen, Kappe drauf, 2× fest aufklopfen.';
  return [
  {id:'load',short:'Einspulen',chip:'Vorbereitung',title:'Film im Dunkeln einspulen',bath:'prep',kind:'prep',est:'5–10 min',
   todo:['Hände, Spiralen und Paterson-Tank müssen vollkommen trocken sein.',
         'Im Wechselsack oder dunklen Raum: '+f.name+' (EI '+targetIso(s)+') auf die Spirale spulen, auf die Mittelsäule stecken und Trichterdeckel fest schließen.',
         'Bei nur einem Kleinbildfilm im Doppeltank die leere zweite Spirale als Sicherung oben aufsetzen.',
         'Licht erst einschalten, wenn der Tankdeckel sicher eingerastet ist.'],
   prepare:['Wechselsack oder Dunkelkammer','Schere, Filmrückholer, Spiralen, Tank']},
  {id:'measure',short:'Ansetzen',chip:'Vorbereitung',title:'Chemie ansetzen & 20 °C prüfen',bath:'prep',kind:'prep',est:'5 min',temp:'20,0 °C',mix:bwMixTxt(),
   todo:['Wasser für den Ansatz auf 20,0 °C temperieren (bei Abweichung zwischen 18 und 24 °C passt der Rechner unten die Zeit laut Adox-Diagramm 2 an).',
         'Adonal / Rodinal erst unmittelbar vor Gebrauch ansetzen (Einmalentwickler): '+bwMixTxt()+'. Mindestens 5 ml Konzentrat pro Film.',
         'Adofix Fixierbad ('+fixMixTxt()+') im zweiten Becher bereitstellen (oder vorhandene Gebrauchslösung prüfen).',
         'Adoflo Netzmittel für das Schlussbad vorbereiten: '+floMixTxt()+' (ideal mit destilliertem Wasser).'],
   prepare:['Thermometer','Messzylinder / Spritze für Rodinal','Becher für Rodinal, Adofix, Adoflo']},
  {id:'dev',short:'Rodinal',chip:'RODINAL',title:'Entwickler · Adonal / Rodinal',bath:'dev',kind:'timed',duration:s.bwDevTime,mode:'invert',temp:'20,0 °C',move:moveTxt(),pourTo:'Abfluss (Einmalentwickler)',mix:bwMixTxt(),
   todo:['Film: '+f.name+' bei EI '+targetIso(s)+' ('+pushLabel(s.bwPush)+', Modus: '+(s.bwPushMode==='conc'?'Push via Entwicklermenge':'Push via Zeit')+').',

function events(c){
  var D=c.duration,s=S.settings,E=[],v=s.volume,tp=s.agTempo;
  var ini=isBw()?s.bwAgInitial:s.agInitial;
  var iv=Math.max(10,isBw()?s.bwAgInterval:s.agInterval);
  var cnt=isBw()?s.bwAgCount:s.agCount;
  if(c.mode==='invert'){
    var iEnd=Math.min(10+ini,D-10);
    var cyc=Math.min(Math.max(3,Math.round(cnt*tp)),iv-3);
    var n=Math.max(1,Math.min(cnt,Math.floor(cyc/tp)));
    E.push({at:0,end:10,cue:'Einfüllen',detail:ini>0?'Zügig durch den Trichter gießen, Kappe drauf.':'Zügig durch den Trichter gießen, Kappe drauf, 2× fest aufklopfen.',kind:'fill'});
    if(iEnd>10)E.push({at:10,end:iEnd,cue:'Durchgehend kippen',detail:'Im Takt des Kreises. Danach 2× fest aufklopfen.',kind:'cont',spin:Math.max(1,Math.floor((iEnd-10)/tp))});
    for(var t=iv;t+cyc<=D-10;t+=iv){if(t<iEnd)continue;E.push({at:t,end:t+cyc,cue:'Jetzt '+n+'× kippen',detail:'Im Takt des Kreises, mit leichter Drehung.',kind:'rot',spin:n});}
    E.push({at:D-10,end:D,cue:'Ausgießen',detail:'In: '+c.pourTo+'.',kind:'drain'});
  }else if(c.mode==='wash'){
    var wk=Math.round(10*tp),e1=Math.min(10+wk,57);
    E.push({at:0,end:10,cue:'Wasser einfüllen',detail:c.temp+', Tank voll machen.',kind:'fill'});
    E.push({at:10,end:e1,cue:'10× kippen',detail:'Im Takt des Kreises. Danach stehen lassen bis zum nächsten Wechsel.',kind:'cont',spin:Math.max(1,Math.min(10,Math.floor((e1-10)/tp)))});
    for(var w=60;w<=D-60;w+=60){
      var ce=Math.min(w+15+wk,w+57,D-10);
      E.push({at:w,end:w+15,cue:'Wasser wechseln',detail:'Ausgießen, frisch füllen, Kappe drauf.',kind:'rot'});
      E.push({at:w+15,end:ce,cue:'10× kippen',detail:'Im Takt des Kreises. Danach stehen lassen.',kind:'cont',spin:Math.max(1,Math.min(10,Math.floor((ce-w-15)/tp)))});
    }
    E.push({at:D-10,end:D,cue:'Ausgießen',detail:'Wasser in den Abfluss.',kind:'drain'});
  }else if(c.mode==='gentle'){
    E.push({at:0,end:10,cue:'Einfüllen',detail:'Ruhig eingießen, Kappe drauf.',kind:'fill'});
    E.push({at:10,end:20,cue:'Sanft bewegen',detail:'Langsam im Takt des Kreises. Nicht schütteln, sonst schäumt das Bad.',kind:'cont',spin:Math.max(1,Math.floor(10/tp))});
    E.push({at:D-10,end:D,cue:'Ausgießen',detail:'In: '+c.pourTo+'.',kind:'drain'});
  }else{
    E.push({at:0,end:10,cue:'Wasser einfüllen',detail:v+' ml, '+c.temp+'.',kind:'fill'});
    E.push({at:10,end:D-10,cue:'Durchgehend kippen',detail:'Im Takt des Kreises.',kind:'cont',spin:Math.max(1,Math.floor((D-20)/tp))});
    E.push({at:D-10,end:D,cue:'Ausgießen',detail:'Vollständig in den Abfluss ausgießen.',kind:'drain'});
  }
  return E;
}

function beep(f,d,delay,force){
  if(!S.settings.sound&&!force)return;

function elapsed(){return (S.before+(S.running?Date.now()-S.startedAt:0))/1000;}
function start(){audio();wake();if(!S.runDate)S.runDate=Date.now();S.running=true;S.startedAt=Date.now();save();renderWork();}
function pause(){S.before+=Date.now()-S.startedAt;S.running=false;save();renderWork();}
function goto(i,autostart){
  var st=steps();if(i<0||i>=st.length)return;
  var c=st[S.step];
  if(c&&c.kind==='timed'){var e=elapsed();if(e>0)S.actual[c.id]=e;}
  S.step=i;S.running=false;S.before=0;S.startedAt=0;fired.clear();
  if(autostart)start();else{save();renderWork();}
}
function busy(){var c=steps()[S.step];return c&&c.kind==='timed'&&S.running&&elapsed()<c.duration;}
function partial(){var c=steps()[S.step],t=elapsed();return c&&c.kind==='timed'&&!S.running&&t>0&&t<c.duration;}
function nav(d,btn){
  var st=steps(),j=S.step+d;if(j<0||j>=st.length)return;
  var targetBtn=btn||document.querySelector('[data-act="'+(d<0?'prev':'next')+'"]');
  if(busy()){
    if(targetBtn)confirmBtn(targetBtn,'nav'+d,'Timer läuft – trotzdem '+(d>0?'weiter':'zurück')+'?',function(){goto(j,false);});
    else toast('Timer läuft. Nochmal Pfeiltaste drücken zum Wechseln.');
    return;
  }
  if(partial()){
    if(targetBtn)confirmBtn(targetBtn,'nav'+d,'Zeit verwerfen?',function(){goto(j,false);});
    else goto(j,false);
    return;
  }
  goto(j,false);
}
function jump(j){
  var st=steps();if(j<0||j>=st.length||j===S.step)return;
  if(busy()){toast('Der Timer läuft. Erst pausieren oder mit Pfeiltaste zweimal bestätigen.');return;}
  if(partial()){toast('Schritt ist angefangen ('+fmt(elapsed())+'). Erst „Zeit zurücksetzen“.');return;}
  goto(j,false);
}
function fire(key,at,t,fn,win){if(fired.has(key))return;if(t>=at){fired.add(key);if(t-at<win)fn();}}
function signals(c,t){
  events(c).forEach(function(e){
    if(e.kind==='fill')return;
    var id=c.id+'|'+e.kind+'|'+e.at;
    if(e.kind==='rot'||e.kind==='drain'){[3,2,1].forEach(function(p){fire(id+'|p'+p,e.at-p,t,function(){beep(660,0.08);},1.2);});}
    fire(id+'|go',e.at,t,function(){
      if(e.kind==='drain'){beep(520,0.3);beep(520,0.3,0.4);vib([250,100,250]);}
      else{beep(1040,0.35);vib(200);}
    },Math.max(1.2,e.end-e.at));
  });
  fire(c.id+'|end',c.duration,t,function(){beep(880,0.2);beep(880,0.2,0.3);beep(1180,0.45,0.6);vib([300,100,300,100,300]);},5);
}

  });

function parseCsv(txt){
  txt=txt.replace(/^\ufeff/,'');var rows=[],row=[],cell='',q=false;
  for(var i=0;i<txt.length;i++){var ch=txt[i];
    if(q){if(ch==='"'){if(txt[i+1]==='"'){cell+='"';i++;}else q=false;}else cell+=ch;}
    else if(ch==='"')q=true;else if(ch===';'){row.push(cell);cell='';}
    else if(ch==='\n'){row.push(cell);rows.push(row);row=[];cell='';}
    else if(ch!=='\r')cell+=ch;}
  if(cell||row.length){row.push(cell);rows.push(row);}
  var head=rows.shift()||[],out=[];
  function ix(n){return head.indexOf(n);}
  function sec(v){var t=parseTime(v||'');return t||0;}
  rows.forEach(function(r){var id=r[ix('id')];if(!id)return;
    var a={};[['prewarm','vorwaermen_ist'],['dev','dev_ist'],['blix','blix_ist'],['wash','waessern_ist'],['stab','stab_ist']].forEach(function(m){var v=sec(r[ix(m[1])]);if(v)a[m[0]]=v;});
    var d=Date.parse(r[ix('datum')]);
    var pr=ix('prozess')>=0&&r[ix('prozess')]==='bw'?'bw':'c41';
    var fl=ix('film_info')>=0?r[ix('film_info')]:'';
    out.push({id:id,proc:pr,date:isFinite(d)?d:Number(id)||Date.now(),filmNo:Number(r[ix('film_nr')])||1,films:Number(r[ix('filme')])===2?2:1,filmLabel:fl,volume:Number(r[ix('menge_ml')])===300?300:500,temp:r[ix('dev_temp_c')]||'',devTime:sec(r[ix('dev_soll')])||480,move:r[ix('bewegung')]||'',actual:a,notes:r[ix('notizen')]||''});});
  return out;
}

  try{

    if(navigator.canShare&&navigator.canShare({files:[f]})){navigator.share({files:[f],title:'Labor Logbuch'}).catch(function(){});return;}
  }catch(e){}
  var a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();
  setTimeout(function(){URL.revokeObjectURL(a.href);a.remove();},1000);
}
function importCsv(file){
  var r=new FileReader();
  r.onload=function(){
    var add=parseCsv(String(r.result)),l=loadLog(),ids={},n=0;
    l.forEach(function(e){ids[e.id]=1;});
    add.forEach(function(e){if(!ids[e.id]){l.push(e);n++;}});
    l.sort(function(x,y){return y.date-x.date;});
    if(saveLog(l)){toast(n+' Durchgänge importiert.');renderLog();}
  };
  r.readAsText(file);
}

function renderInner(){

function updateTempHint(){
  var h=document.getElementById('tempHint');if(!h)return;
  var v=parseFloat(S.temp);
  if(isBw()){
    var s=S.settings,rec=calcBwRecipe(s);
    if(!isFinite(v)){
      h.className='hint';
      h.textContent='Ansatz: '+bwMixTxt()+' · Soll: 20,0 °C (bei 18–24 °C Temperatur eintragen für Zeitkorrektur laut Rodinal-Diagramm 2).';
      return;
    }
    var d=Math.round((v-20)*10)/10;
    if(Math.abs(d)<=0.3){
      h.className='hint ok';
      h.textContent='20,0 °C passt optimal! Ansatz: '+bwMixTxt()+'.';
    }else if(v>=18&&v<=24){
      var adj=rodinalTempTime(rec.devTime,v);
      h.className='hint warn';
      h.innerHTML='Gemessen '+dec(v,1)+' °C: Laut Adox Rodinal-Diagramm 2 entspricht '+fmt(rec.devTime)+' (bei 20 °C) jetzt <b>'+fmt(adj)+' min</b>. <button type="button" class="btn small" data-act="applytemp" data-sec="'+adj+'">'+fmt(adj)+' übernehmen</button>';
    }else{
      h.className='hint warn';
      h.textContent='Temperatur ('+dec(v,1)+' °C) außerhalb des empfohlenen Bereichs (18–24 °C). Bitte auf 20 °C temperieren.';
    }
    return;
  }
  if(!isFinite(v)){h.className='hint';h.textContent='Wert eintragen, er kommt ins Protokoll.';return;}
  var dc=Math.round((v-30)*10)/10;
  if(Math.abs(dc)<=0.3){h.className='hint ok';h.textContent='Passt. Abweichung höchstens 0,3 °C.';}
  else{h.className='hint warn';h.textContent=(dc>0?'Zu warm':'Zu kalt')+' um '+dec(Math.abs(dc),1)+' °C. Warten, bis der Entwickler 30 °C hat.';}
}

function primaryLabel(st,i,t){
  var c=st[i],n=st[i+1];
  if(!n)return 'Neuer Durchgang';
  if(c.kind==='timed'){
    if(t>=c.duration)return n.kind==='timed'?n.title+' starten →':'Weiter: '+n.title+' →';
    if(S.running)return 'Pause (Leertaste)';
    return t>0?'Fortsetzen (Leertaste)':'Start – jetzt eingießen (Leertaste)';
  }
  if(c.id==='heat')return S.heatStart?'Weiter: Film einspulen →':'Heizen läuft – weiter →';
  if(c.id==='hang')return 'Hängt – weiter →';
  return 'Erledigt – weiter →';
}
function primary(btn){
  audio();
  var st=steps(),i=S.step,c=st[i],n=st[i+1];
  if(!n){confirmBtn(btn,'primary','Wirklich neu beginnen?',newRun);return;}
  if(c.kind==='timed'){
    var t=elapsed();
    if(t>=c.duration){goto(i+1,n.kind==='timed');return;}
    if(S.running)pause();else start();

  }
  if(c.id==='heat'&&!S.heatStart)S.heatStart=Date.now();

}

function setText(id,txt){var el=document.getElementById(id);if(el&&el.textContent!==txt)el.textContent=txt;}
function tick(){
  var st=steps(),i=S.step,c=st[i],n=st[i+1],t=elapsed();
  if(!c)return;
  if(c.kind==='timed'&&S.running)signals(c,t);

  var chip=document.getElementById('heatChip');
  if(!isBw()&&S.heatStart&&i<stepIndex('dev')){chip.hidden=false;var ht='<i></i>Bad heizt seit '+fmt((Date.now()-S.heatStart)/1000);if(chip.innerHTML!==ht)chip.innerHTML=ht;}else chip.hidden=true;
  var rc=document.getElementById('runChip');
  if(c.kind==='timed'&&S.running&&S.tab!=='arbeitsweg'){
    rc.hidden=false;rc.className='chip b-'+c.bath;
    var rt='<i></i>'+c.title+' · '+(t<c.duration?fmt(Math.ceil(c.duration-t)):'fertig');
    if(rc.innerHTML!==rt)rc.innerHTML=rt;
  }else rc.hidden=true;
  document.getElementById('soundWarn').hidden=!(S.running&&S.settings.sound&&(!ac||ac.state!=='running'));

  if(S.tab!=='arbeitsweg')return;
  var cue=document.getElementById('cue');if(!cue)return;
  var clock=document.getElementById('clock'),rotWrap=document.getElementById('rotWrap'),stepBar=document.getElementById('stepBar'),rotBar=document.getElementById('rotBar');
  var tone='rest';
  if(c.kind==='timed'){
    var D=c.duration,E=events(c);
    clock.classList.toggle('over',t>=D);
    setText('clockVal',t<D?fmt(Math.ceil(D-t)):'+'+fmt(t-D));
    setText('clockLbl',t>=D?'Über der Zeit':S.running?'Restzeit':t>0?'Pausiert':'Bereit – Start beim Eingießen');
    stepBar.style.width=Math.min(100,t/D*100)+'%';
    var rots=E.filter(function(e){return e.kind==='rot';});
    var rotDone=rots.filter(function(e){return e.at<=t;}).length;
    var cntTxt=rots.length?(c.mode==='wash'?'Wasserwechsel ':'Rotation ')+rotDone+' von '+rots.length:'';
    if(t>=D){
      tone='done';rotWrap.hidden=true;
      setText('cueMain','Fertig');
      setText('cueDetail',n?(n.kind==='timed'?'Tank leer? Dann '+n.title+' starten (oder Pfeiltaste →).':'Weiter mit Pfeiltaste → oder Hauptknopf.'):'');
    }else if(t===0&&!S.running){
      tone='ready';rotWrap.hidden=false;
      setText('cueMain','Bereit');setText('cueDetail','Start drücken (oder Leertaste), sobald du eingießt. Bewegung: '+c.move+'.');
      setText('rotLbl',rots.length?(c.mode==='wash'?'Wasserwechsel geplant':'Rotationen geplant'):'Dauer');
      setText('rotVal',rots.length?String(rots.length):fmt(D));
      rotBar.style.width='0%';setText('rotCount','');
    }else{
      rotWrap.hidden=false;
      var act=null;E.forEach(function(e){if(t>=e.at&&t<e.end)act=e;});
      var nxt=null;for(var k=0;k<E.length;k++){if(E[k].at>t&&(E[k].kind==='rot'||E[k].kind==='drain')){nxt=E[k];break;}}
      if(act){
        tone=act.kind;
        setText('cueMain',act.cue);setText('cueDetail',(S.running?'':'Pausiert. ')+act.detail);
        var lbl=act.kind==='rot'?(c.mode==='wash'?'Wechseln – noch':'Kippen – noch'):act.kind==='drain'?'Ausgießen – noch':act.kind==='fill'?'Einfüllen – noch':'Noch';
        setText('rotLbl',lbl);setText('rotVal',fmt(Math.ceil(act.end-t)));
        rotBar.style.width=Math.min(100,(t-act.at)/(act.end-act.at)*100)+'%';
      }else{
        var r=REST[c.mode];
        setText('cueMain',r[0]);setText('cueDetail',(S.running?'':'Pausiert. ')+r[1]);
        if(nxt){
          var prev=0;E.forEach(function(e){if(e.end<=t&&e.end>prev)prev=e.end;});
          setText('rotLbl',nxt.kind==='drain'?'Ausgießen in':(c.mode==='wash'?'Nächster Wasserwechsel in':'Nächste Rotation in'));
          setText('rotVal',fmt(Math.ceil(nxt.at-t)));
          rotBar.style.width=Math.min(100,Math.max(0,(t-prev)/(nxt.at-prev)*100))+'%';
        }
      }
      setText('rotCount',cntTxt);
    }
  }else{
    rotWrap.hidden=true;clock.classList.remove('over');
    var total=c.todo.length,on=0;
    for(var j=0;j<total;j++)if(S.checks[S.proc+'-'+c.id+'-'+j]||S.checks[c.id+'-'+j])on++;
    stepBar.style.width=(total?on/total*100:0)+'%';
    tone=on===total?'done':'rest';
    setText('cueMain',on===total?'Alles erledigt':on+' von '+total+' Punkten bereit');
    setText('cueDetail',on===total?'Drücke → oder den Hauptknopf für den nächsten Schritt.':'Punkte prüfen/abhaken oder direkt mit → weiterklicken.');
    if(!isBw()&&(c.id==='load'||c.id==='measure'||c.id==='heat')&&S.heatStart){setText('clockLbl','Bad heizt seit');setText('clockVal',fmt((Date.now()-S.heatStart)/1000));}
    else if(c.id==='clean'&&S.dryStart){setText('clockLbl','Film trocknet seit');setText('clockVal',fmt((Date.now()-S.dryStart)/1000));}
    else{setText('clockLbl','Richtzeit / Vorbereitung');setText('clockVal',c.est||'Bereit');}
  }
  var cls='cue'+(c.kind!=='timed'?' is-prep':'')+' is-'+tone;if(cue.className!==cls)cue.className=cls;
  var pb=document.getElementById('primary');
  if(pb&&!armed.primary){
    var lab=primaryLabel(st,i,t);if(pb.textContent!==lab)pb.textContent=lab;
    pb.classList.toggle('primary',!(c.kind==='timed'&&S.running&&t<c.duration));
  }
  var rem=0;if(c.kind==='timed')rem+=Math.max(0,c.duration-t);
  st.slice(i+1).forEach(function(x){if(x.kind==='timed')rem+=x.duration;});
  var eta=document.getElementById('eta');
  if(eta){
    if(rem>0){
      var at=new Date(Date.now()+rem*1000).toLocaleTimeString('de-DE',{hour:'2-digit',minute:'2-digit'});
      var pre=(c.kind!=='timed'||(t===0&&!S.running))?'Bei Start jetzt ist die Nasschemie fertig um ':'Nasschemie fertig um ';
      var html=pre+'<b>'+at+'</b> · noch '+fmt(rem)+' min';
      if(eta.innerHTML!==html)eta.innerHTML=html;
    }else if(eta.innerHTML!=='')eta.innerHTML='';
  }
}

/* ---------- Takt-Kreis ---------- */
function metroFrame(){
  requestAnimationFrame(metroFrame);
  if(S.tab!=='arbeitsweg')return;
  var m=document.getElementById('metro');if(!m)return;
  var c=steps()[S.step];if(!c||c.kind!=='timed')return;
  var t=elapsed(),act=null;
  if(t<c.duration)events(c).forEach(function(e){if(t>=e.at&&t<e.end)act=e;});
  var g=document.getElementById('metroRot'),num=document.getElementById('metroNum');
  if(act&&act.spin){
    var p=(t-act.at)/S.settings.agTempo,k=Math.min(act.spin,Math.floor(p)+1),txt=k+'/'+act.spin;
    g.setAttribute('transform','rotate('+((p%1)*360).toFixed(1)+' 50 50)');
    if(num.textContent!==txt)num.textContent=txt;
    m.classList.remove('idle');
  }else{
    g.setAttribute('transform','rotate(0 50 50)');
    if(num.textContent!=='')num.textContent='';
    m.classList.add('idle');
  }
}

/* ---------- Ereignisse ---------- */
var NUMS={
  'set-film':['filmNo',1,99],
  'set-agi':['agInitial',0,60],'set-agv':['agInterval',10,120],'set-agc':['agCount',1,10],'set-agt':['agTempo',1,4,true],
  'set-bw-agi':['bwAgInitial',0,120],'set-bw-agv':['bwAgInterval',10,120],'set-bw-agc':['bwAgCount',1,10]
};
function refreshDynamic(){if(S.tab==='uebersicht')updateOverviewDyn();else if(S.tab==='arbeitsweg')renderWork();tick();}
function syncBwRecipe(){
  var s=S.settings,rec=calcBwRecipe(s);
  s.bwDevTime=rec.devTime;
  s.bwConcMl=rec.concMl;
}

document.addEventListener('click',function(e){
  var b=e.target.closest('[data-act]');if(!b)return;
  var a=b.dataset.act;
  if(a==='tab'){setTab(b.dataset.tab);return;}
  if(a==='proc'){setProc(b.dataset.proc);return;}
  if(a==='theme'){
    S.theme=S.theme==='auto'?'dark':S.theme==='dark'?'light':'auto';
    save();applyTheme();return;
  }
  if(a==='pickfilm'){
    var fk=b.dataset.film;if(!BW_FILMS[fk])return;
    S.settings.bwFilm=fk;syncBwRecipe();save();renderOverview();
    toast(BW_FILMS[fk].name+' übernommen: '+fmt(S.settings.bwDevTime)+' min ('+bwMixTxt()+').');
    return;
  }
  if(a==='applytemp'){
    var sec=clamp(b.dataset.sec,60,5400);
    S.settings.bwDevTime=sec;save();renderWork();
    toast('Temperatur-korrigierte Entwicklerzeit übernommen: '+fmt(sec)+' min.');
    return;
  }
  if(a==='sound'){S.settings.sound=!S.settings.sound;save();if(S.settings.sound){audio();beep(880,0.12);}updateHeader();tick();return;}
  if(a==='unlock'){audio();wake();setTimeout(tick,50);return;}
  if(a==='primary'){primary(b);return;}
  if(a==='prev'||a==='next'){nav(a==='prev'?-1:1,b);return;}
  if(a==='jump'){jump(Number(b.dataset.i));return;}
  if(a==='reset'){confirmBtn(b,'reset','Wirklich zurücksetzen?',function(){S.running=false;S.before=0;S.startedAt=0;fired.clear();save();renderWork();});return;}
  if(a==='testsound'){audio();beep(660,0.08,0,true);beep(660,0.08,0.25,true);beep(1040,0.35,0.5,true);vib(200);return;}
  if(a==='defaults'){
    var s=S.settings;
    if(isBw()){
      s.bwAgInitial=DEF.bwAgInitial;s.bwAgInterval=DEF.bwAgInterval;s.bwAgCount=DEF.bwAgCount;s.agTempo=DEF.agTempo;
      s.bwFixTime=DEF.bwFixTime;s.bwWashTime=DEF.bwWashTime;syncBwRecipe();
      save();renderOverview();toast('S/W-Standardwerte (Rodinal / Adofix / Adoflo) wiederhergestellt.');
    }else{
      s.agInitial=DEF.agInitial;s.agInterval=DEF.agInterval;s.agCount=DEF.agCount;s.agTempo=DEF.agTempo;
      save();renderOverview();toast('Bewegung auf Standard zurückgesetzt.');
    }
    return;
  }
  if(a==='packreset'){confirmBtn(b,'packreset','Wirklich alles abwählen?',function(){S.pack={};save();renderPack();});return;}
  if(a==='saverun'){saveRun(false);if(S.tab==='logbuch')renderLog();return;}
  if(a==='export'){exportCsv();return;}
  if(a==='dellog'){var id=b.dataset.id;confirmBtn(b,'del'+id,'Wirklich?',function(){saveLog(loadLog().filter(function(e){return e.id!==id;}));renderLog();});return;}
  if(a==='copy'){
    var txt=protocol(),pre=document.getElementById('proto');
    var sel=function(){try{var r=document.createRange();r.selectNodeContents(pre);var w=window.getSelection();w.removeAllRanges();w.addRange(r);toast('Text markiert. Jetzt kopieren.');}catch(x){}};
    try{navigator.clipboard.writeText(txt).then(function(){toast('Protokoll kopiert.');},sel);}catch(x){sel();}
    return;
  }
});
document.addEventListener('change',function(e){
  var el=e.target,s=S.settings;
  if(el.id==='csvIn'){if(el.files&&el.files[0])importCsv(el.files[0]);return;}
  if(el.dataset.pk){S.pack[el.dataset.pk]=el.checked;save();updatePackCount();return;}
  if(el.dataset.ck){S.checks[el.dataset.ck]=el.checked;save();tick();return;}
  var timeMap={
    'set-dev':['devTime','8:00',60,3600],'devInline':['devTime','8:00',60,3600],
    'set-blix':['blixTime','6:00',60,3600],'blixInline':['blixTime','6:00',60,3600],
    'set-bw-dev':['bwDevTime','6:00',60,5400],'bwDevInline':['bwDevTime','6:00',60,5400],
    'set-bw-fix':['bwFixTime','5:00',60,1800],'bwFixInline':['bwFixTime','5:00',60,1800],
    'set-bw-wash':['bwWashTime','6:00',60,1800]
  };
  if(timeMap[el.id]){
    var tm=timeMap[el.id],v=parseTime(el.value),err=document.getElementById(el.id+'-err');
    if(v&&v>=tm[2]&&v<=tm[3]){s[tm[0]]=v;save();el.value=fmt(v);if(err)err.textContent='';refreshDynamic();}
    else if(err)err.textContent='Bitte als m:ss eingeben, z. B. '+tm[1]+'.';
    return;
  }
  if(el.id==='set-bw-film'||el.id==='bwFilmInline'){
    if(BW_FILMS[el.value]){s.bwFilm=el.value;syncBwRecipe();save();if(S.tab==='uebersicht')renderOverview();else renderWork();}
    return;
  }
  if(el.id==='set-bw-dil'||el.id==='bwDilInline'){
    s.bwDil=el.value==='1+50'?'1+50':'1+25';syncBwRecipe();save();if(S.tab==='uebersicht')renderOverview();else renderWork();
    return;
  }
  if(el.id==='set-bw-push'||el.id==='bwPushInline'){
    s.bwPush=clamp(el.value,-1,3);syncBwRecipe();save();if(S.tab==='uebersicht')renderOverview();else renderWork();
    return;
  }
  if(el.id==='set-bw-pmode'||el.id==='bwModeInline'){
    s.bwPushMode=el.value==='conc'?'conc':'time';syncBwRecipe();save();if(S.tab==='uebersicht')renderOverview();else renderWork();
    return;
  }
  if(el.id==='set-bw-conc'||el.id==='bwConcInline'){
    var cml=clampHalf(el.value,3,100);s.bwConcMl=cml;el.value=cml;save();refreshDynamic();
    return;
  }
  if(el.id==='set-bw-fixdil'){
    s.bwFixDil=el.value==='1+4'?'1+4':'1+7';save();refreshDynamic();
    return;
  }
  var spec=NUMS[el.id];
  if(spec){
    var raw=String(el.value).trim().replace(',','.');
    if(raw===''||!isFinite(Number(raw))){el.value=s[spec[0]];return;}
    s[spec[0]]=spec[3]?clampHalf(raw,spec[1],spec[2]):clamp(raw,spec[1],spec[2]);
    el.value=s[spec[0]];
  }else if(el.id==='set-vol'){
    s.volume=el.value==='300'?300:500;
    if(s.volume===300){s.films=1;setVal('set-films','1');}
    syncBwRecipe();
    if(S.tab==='uebersicht'){save();renderOverview();return;}
  }else if(el.id==='set-films'){s.films=el.value==='2'?2:1;if(s.films===2&&s.volume===300){s.volume=500;setVal('set-vol','500');}}
  else if(el.id==='set-sound'){s.sound=el.checked;save();updateHeader();tick();return;}
  else return;
  save();refreshDynamic();
});
document.addEventListener('input',function(e){
  if(e.target.id==='temp'){S.temp=e.target.value;save();updateTempHint();}
  if(e.target.id==='notes'){S.notes=e.target.value;save();updateProto();}
});
document.addEventListener('submit',function(e){e.preventDefault();});
document.addEventListener('keydown',function(e){
  if(e.altKey||e.ctrlKey||e.metaKey)return;
  var tg=e.target&&e.target.tagName;
  var isTextIn=(tg==='TEXTAREA'||tg==='SELECT'||(tg==='INPUT'&&e.target.type!=='checkbox'&&e.target.type!=='button'));
  if(isTextIn)return;
  var inTabs=e.target&&e.target.closest&&e.target.closest('.tabs');
  if(inTabs&&(e.key==='ArrowRight'||e.key==='ArrowLeft')){
    e.preventDefault();
    var ti= (TABS.indexOf(S.tab)+(e.key==='ArrowRight'?1:TABS.length-1))%TABS.length;
    setTab(TABS[ti]);
    var tb=document.getElementById('tab-'+TABS[ti]);if(tb)tb.focus();
    return;
  }
  if(S.tab==='arbeitsweg'){
    if(e.code==='Space'){
      var inTop=e.target&&e.target.closest&&e.target.closest('.top');
      if(tg==='BUTTON'&&!inTop)return;
      if(tg==='INPUT'&&e.target.type==='checkbox')return;
      e.preventDefault();if(e.repeat)return;
      var p=document.getElementById('primary');if(p)p.click();
    }else if(e.key==='ArrowRight'){
      e.preventDefault();if(!e.repeat)nav(1);
    }else if(e.key==='ArrowLeft'){
      e.preventDefault();if(!e.repeat)nav(-1);
    }
  }else if(e.key==='ArrowRight'||e.key==='ArrowLeft'){
    if(tg==='BUTTON')return;
    e.preventDefault();if(e.repeat)return;
    var ni=(TABS.indexOf(S.tab)+(e.key==='ArrowRight'?1:TABS.length-1))%TABS.length;
    setTab(TABS[ni]);
  }
});
function applyHash(){
  var raw=(location.hash||'').slice(1);if(!raw)return false;
  var parts=raw.split(/[\/-]/);
  var changed=false;
  parts.forEach(function(p){
    if(p==='bw'||p==='c41'){if(S.proc!==p){S.proc=p;S.step=0;changed=true;}}
    else if(TABS.indexOf(p)>=0&&S.tab!==p){S.tab=p;changed=true;}
    else if(/^\d+$/.test(p)){S.step=Math.max(0,Number(p));changed=true;}
  });
  return changed;
}
window.addEventListener('hashchange',function(){if(applyHash()){save();render();}});

applyHash();
render();
setInterval(tick,200);
requestAnimationFrame(metroFrame);
})();
